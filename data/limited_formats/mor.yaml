# Sealed in this set's season: the block's Lorwyn tournament pack
# plus two boosters, which is the era's standard two (README, Sealed pools).
# Which two is derived, not sourced - no Grand Prix fact sheet survives for a
# mid-block season. Both are taken to be MOR, following the DCI's own
# set selection for team events, which puts every booster in the newest small
# set ("If the first small expansion has been released, the four boosters
# should be from the first small expansion", Floor Rules section 148).
sealed:
- 1x lrw-tournament
- 2x mor-draft
prerelease-sealed:
  # "you will get one Lorwyn tournament pack and three Morningtide boosters to
  # create a deck (Sealed Deck tournaments usually provide only two boosters,
  # but it's the Prerelease!)"
  # https://magic.wizards.com/en/news/feature/morningtide-prerelease-primer
  boosters:
  - 1x lrw-tournament
  - 3x mor-draft
  unplayable-promo:
  - Door of Destinies [PMOR:143★] [foil]
draft:
- lrw-draft
- lrw-draft
- mor-draft
