# Shadows over Innistrad Remastered was a Magic Arena only set, drafted with a
# bonus sheet, Shadows of the Past, split into four groups of cards. Each group
# spent a week in the boosters, so the set was drafted four times, with a
# different booster every time.
# https://magic.wizards.com/en/news/mtg-arena/shadows-of-the-past-card-list-and-schedule
arena-draft-1:
  name: "{set_name} Arena Draft: Creature Type Terror"
  description: >-
    The Shadows of the Past bonus sheet these boosters open was in four
    groups, one week of drafting each, so the set had four drafts rather
    than one. This is the first of them, drafted from March 21 to 28, 2023,
    when the bonus cards were the tribal ones of Creature Type Terror.
  boosters:
  - sir-arena-1
  - sir-arena-1
  - sir-arena-1
arena-draft-2:
  name: "{set_name} Arena Draft: Fatal Flashback"
  description: >-
    The Shadows of the Past bonus sheet these boosters open was in four
    groups, one week of drafting each, so the set had four drafts rather
    than one. This is the second of them, drafted from March 28 to April 4,
    2023, when the bonus cards were the flashback spells of Fatal Flashback.
  boosters:
  - sir-arena-2
  - sir-arena-2
  - sir-arena-2
arena-draft-3:
  name: "{set_name} Arena Draft: Morbid and Macabre"
  description: >-
    The Shadows of the Past bonus sheet these boosters open was in four
    groups, one week of drafting each, so the set had four drafts rather
    than one. This is the third of them, drafted from April 4 to 11, 2023,
    when the bonus cards were the death and sacrifice ones of Morbid and
    Macabre.
  boosters:
  - sir-arena-3
  - sir-arena-3
  - sir-arena-3
arena-draft-4:
  name: "{set_name} Arena Draft: Abominable All Stars"
  description: >-
    The Shadows of the Past bonus sheet these boosters open was in four
    groups, one week of drafting each, so the set had four drafts rather
    than one. This is the last of them, drafted from April 11 to 18, 2023,
    when the bonus cards were the mythics and other iconic cards of
    Abominable All Stars.
  boosters:
  - sir-arena-4
  - sir-arena-4
  - sir-arena-4
