# Grand Prix Stockholm, 5-6 May 2007, the weekend after Future Sight came out:
# "Tournament Format: Sealed Deck (Time Spiral tournament pack and 1 Planar
# Chaos and 1 Future Sight Booster)". The other pinned-down pool - a full block
# is the large set's tournament pack plus one booster of each small set.
# https://web.archive.org/web/2018/https://magic.wizards.com/en/articles/archive/feature/tournament-fact-sheet-2007-03-19
sealed:
- 1x tsp-tournament
- 1x plc-draft
- 1x fut-draft
prerelease-sealed:
  # "for this weekend's event I was handed one 75-card tournament pack of Time
  # Spiral and three 15-card booster packs of Future Sight"
  # https://magic.wizards.com/en/news/feature/future-sight-prerelease-primer
  boosters:
  - 1x tsp-tournament
  - 3x fut-draft
  unplayable-promo:
  - Korlash, Heir to Blackblade [PFUT:87★] [foil]
draft:
- tsp-draft
- plc-draft
- fut-draft
