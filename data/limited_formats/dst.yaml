# Sealed in this set's season: the block's Mirrodin tournament pack
# plus two boosters, which is the era's standard two (README, Sealed pools).
# Which two is derived, not sourced - no Grand Prix fact sheet survives for a
# mid-block season. Both are taken to be DST, following the DCI's own
# set selection for team events, which puts every booster in the newest small
# set ("If the first small expansion has been released, the four boosters
# should be from the first small expansion", Floor Rules section 148).
sealed:
- 1x mrd-tournament
- 2x dst-draft
prerelease-sealed:
  # "you will receive a Mirrodin Tournament Pack, three Darksteel booster
  # packs and a commemorative foil Prerelease card"
  # https://magic.wizards.com/en/news/feature/darksteel-prerelease-primer
  boosters:
  - 1x mrd-tournament
  - 3x dst-draft
  unplayable-promo:
  - Shield of Kaldra [PDST:139★] [foil]
draft:
- mrd-draft
- mrd-draft
- dst-draft
