# Sealed in this set's season, and the era's standard pool: the set's own
# tournament pack plus two of its own boosters (README, Sealed pools). The
# shape is sourced for Time Spiral, by the Grand Prix Athens fact sheet in
# tsp.yaml; no event sheet survives for this set's own season.
sealed:
- 1x mrd-tournament
- 2x mrd-draft
prerelease-sealed:
  # "you will receive a Mirrodin Tournament Pack, two Mirrodin booster packs
  # and a commemorative foil Prerelease card (you cannot use this card to
  # build your deck)"
  # https://magic.wizards.com/en/news/feature/mirrodin-prerelease-primer
  boosters:
  - 1x mrd-tournament
  - 2x mrd-draft
  unplayable-promo:
  - Sword of Kaldra [PMRD:251★] [foil]
draft:
- mrd-draft
- mrd-draft
- mrd-draft
