# Sealed in this set's season, and the era's standard pool: the set's own
# tournament pack plus two of its own boosters (README, Sealed pools). The
# shape is sourced for Time Spiral, by the Grand Prix Athens fact sheet in
# tsp.yaml; no event sheet survives for this set's own season.
sealed:
- 1x lrw-tournament
- 2x lrw-draft
prerelease-sealed:
  # "you will receive a Lorwyn tournament pack, two Lorwyn booster packs, and
  # a commemorative foil prerelease card (you cannot use this card to build
  # your deck)"
  # https://magic.wizards.com/en/news/feature/lorwyn-prerelease-primer
  boosters:
  - 1x lrw-tournament
  - 2x lrw-draft
  unplayable-promo:
  - Wren's Run Packmaster [PLRW:244★] [foil]
draft:
- lrw-draft
- lrw-draft
- lrw-draft
