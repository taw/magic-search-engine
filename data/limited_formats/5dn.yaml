# Sealed in this set's season: the block's Mirrodin tournament pack
# plus one booster of each small set. Sourced for the Time Spiral block by
# the Grand Prix Stockholm fact sheet in fut.yaml, and the same shape is used
# for every completed block of the era.
sealed:
- 1x mrd-tournament
- 1x dst-draft
- 1x 5dn-draft
prerelease-sealed:
  # "you will receive a Mirrodin Tournament Pack, three Fifth Dawn booster
  # packs and a commemorative foil Prerelease card"
  # https://magic.wizards.com/en/news/feature/fifth-dawn-prerelease-primer
  boosters:
  - 1x mrd-tournament
  - 3x 5dn-draft
  unplayable-promo:
  - Helm of Kaldra [P5DN:131★] [foil]
draft:
- mrd-draft
- dst-draft
- 5dn-draft
