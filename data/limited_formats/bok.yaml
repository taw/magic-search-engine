# Sealed in this set's season: the block's Champions of Kamigawa tournament pack
# plus two boosters, which is the era's standard two (README, Sealed pools).
# Which two is derived, not sourced - no Grand Prix fact sheet survives for a
# mid-block season. Both are taken to be BOK, following the DCI's own
# set selection for team events, which puts every booster in the newest small
# set ("If the first small expansion has been released, the four boosters
# should be from the first small expansion", Floor Rules section 148).
sealed:
- 1x chk-tournament
- 2x bok-draft
prerelease-sealed:
  # Unsourced. Entered as the era's standard small-set prerelease pool: the
  # block's Champions of Kamigawa tournament pack plus three boosters of the new set.
  # Three rather than the two an ordinary sealed event gave out is the
  # prerelease's extra booster, which is why this and `sealed` above disagree
  # - see README, Prereleases. Every small set of the era with a surviving
  # source says three, but this one has none: February 2005 predates both the
  # fact sheets, which start in late 2005, and any surviving primer.
  boosters:
  - 1x chk-tournament
  - 3x bok-draft
  unplayable-promo:
  - Ink-Eyes, Servant of Oni [PBOK:71★] [foil]
draft:
- chk-draft
- chk-draft
- bok-draft
