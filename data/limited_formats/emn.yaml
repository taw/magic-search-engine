# Block sealed, in the same proportion as the EMN/EMN/SOI draft: 4x emn-draft + 2x soi-draft.
# The prerelease pool is the same six, plus the seeded prerelease pack.
# See README, Sealed pools.
sealed:
- 4x emn-draft
- 2x soi-draft
prerelease-sealed:
  boosters:
  - 4x emn-draft
  - 2x soi-draft
  - 1x emn-prerelease
draft:
- emn-draft
- emn-draft
- soi-draft
