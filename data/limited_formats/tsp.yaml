# Grand Prix Athens, 14-15 October 2006, when Time Spiral was the only set of
# its block out: "Tournament Format: Sealed Deck (Time Spiral tournament pack
# and 2 Time Spiral boosters)". One of the two events that pin down what a
# tournament-pack era sealed pool actually was - see README.
# https://web.archive.org/web/2018/https://magic.wizards.com/en/articles/archive/feature/tournament-fact-sheet-2006-06-09
sealed:
- 1x tsp-tournament
- 2x tsp-draft
prerelease-sealed:
  # "whichever style of Sealed Deck event you choose to play in, you will be
  # working with the same basic materials: one Tournament Pack and two booster
  # packs of Time Spiral"
  # https://magic.wizards.com/en/news/feature/time-spiral-prerelease-primer
  # The set's own fact sheet says it in product terms: "Cost of entry will
  # provide you, one (1) Time Spiral tournament pack and two (2) Time Spiral
  # boosters."
  # https://web.archive.org/web/2018/https://magic.wizards.com/en/articles/archive/feature/time-spiral-worldwide-prerelease-fact-sheet-2006-09-08
  boosters:
  - 1x tsp-tournament
  - 2x tsp-draft
  unplayable-promo:
  - Lotus Bloom [PTSP:259★] [foil]
draft:
- tsp-draft
- tsp-draft
- tsp-draft
