# Pioneer Masters was a Magic Arena only set, and came out in three parts, a
# fortnight apart. Each part put its own bonus sheet in the boosters, so the
# set was drafted three times, with a different booster every time.
# https://magic.wizards.com/en/news/mtg-arena/collecting-pioneer-masters
arena-draft-1:
  name: "{set_name} Arena Draft: Planeswalkers"
  description: >-
    Pioneer Masters came to Magic Arena in three parts, each one putting its
    own bonus sheet in the boosters, so the set had three drafts rather than
    one. This is the first of them, drafted from December 10 to 24, 2024,
    when the bonus sheet was the Planeswalkers one.
  boosters:
  - pio-arena-1
  - pio-arena-1
  - pio-arena-1
arena-draft-2:
  name: "{set_name} Arena Draft: Spells"
  description: >-
    Pioneer Masters came to Magic Arena in three parts, each one putting its
    own bonus sheet in the boosters, so the set had three drafts rather than
    one. This is the second of them, drafted from December 24, 2024 to
    January 7, 2025, when the bonus sheet was the Spells one.
  boosters:
  - pio-arena-2
  - pio-arena-2
  - pio-arena-2
arena-draft-3:
  name: "{set_name} Arena Draft: Devotion"
  description: >-
    Pioneer Masters came to Magic Arena in three parts, each one putting its
    own bonus sheet in the boosters, so the set had three drafts rather than
    one. This is the last of them, drafted from January 7 to 21, 2025, when
    the bonus sheet was the Devotion one.
  boosters:
  - pio-arena-3
  - pio-arena-3
  - pio-arena-3
