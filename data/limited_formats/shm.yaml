# Sealed in this set's season, and the era's standard pool: the set's own
# tournament pack plus two of its own boosters (README, Sealed pools). The
# shape is sourced for Time Spiral, by the Grand Prix Athens fact sheet in
# tsp.yaml; no event sheet survives for this set's own season.
sealed:
- 1x shm-tournament
- 2x shm-draft
prerelease-sealed:
  # "The Shadowmoor Prerelease will be Sealed Deck, with one tournament pack,
  # and either two or three Shadowmoor boosters, depending on your tournament
  # organizer." Three is the bigger of the two, and what a Shadowmoor player
  # would have expected; there is no way to record "or".
  # https://magic.wizards.com/en/news/feature/article-or-shadowmoor-prerelease-primer
  boosters:
  - 1x shm-tournament
  - 3x shm-draft
  unplayable-promo:
  - Demigod of Revenge [PSHM:183★] [foil]
draft:
- shm-draft
- shm-draft
- shm-draft
