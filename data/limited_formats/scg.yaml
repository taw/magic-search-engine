# Sealed in this set's season: the block's Onslaught tournament pack
# plus one booster of each small set. Sourced for the Time Spiral block by
# the Grand Prix Stockholm fact sheet in fut.yaml, and the same shape is used
# for every completed block of the era.
sealed:
- 1x ons-tournament
- 1x lgn-draft
- 1x scg-draft
prerelease-sealed:
  # "This fee covers your entry into the tournament and with that you will
  # receive an Onslaught tournament pack and three Scourge booster packs."
  # https://magic.wizards.com/en/news/feature/scourge-prerelease-primer
  boosters:
  - 1x ons-tournament
  - 3x scg-draft
  unplayable-promo:
  - Soul Collector [PSCG:74] [foil]
draft:
- ons-draft
- lgn-draft
- scg-draft
