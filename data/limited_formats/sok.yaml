# Sealed in this set's season: the block's Champions of Kamigawa tournament pack
# plus one booster of each small set. Sourced for the Time Spiral block by
# the Grand Prix Stockholm fact sheet in fut.yaml, and the same shape is used
# for every completed block of the era.
sealed:
- 1x chk-tournament
- 1x bok-draft
- 1x sok-draft
prerelease-sealed:
  # Caption on the product photo: "Champions of Kamigawa tournament pack and
  # three Saviors of Kamigawa boosters"
  # https://magic.wizards.com/en/news/feature/saviors-of-kamigawa-prerelease-primer
  boosters:
  - 1x chk-tournament
  - 3x sok-draft
  unplayable-promo:
  - Kiyomaro, First to Stand [PSOK:18★] [foil]
draft:
- chk-draft
- bok-draft
- sok-draft
