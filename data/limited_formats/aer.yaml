# Block sealed, in the same proportion as the AER/AER/KLD draft: 4x aer-draft + 2x kld-draft.
# The prerelease pool is the same six, plus the seeded prerelease pack.
# See README, Sealed pools.
sealed:
- 4x aer-draft
- 2x kld-draft
prerelease-sealed:
  boosters:
  - 4x aer-draft
  - 2x kld-draft
  - 1x aer-prerelease
draft:
- aer-draft
- aer-draft
- kld-draft
