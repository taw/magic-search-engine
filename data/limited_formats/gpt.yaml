# Sealed in this set's season: the block's Ravnica tournament pack
# plus two boosters, which is the era's standard two (README, Sealed pools).
# Which two is derived, not sourced - no Grand Prix fact sheet survives for a
# mid-block season. Both are taken to be GPT, following the DCI's own
# set selection for team events, which puts every booster in the newest small
# set ("If the first small expansion has been released, the four boosters
# should be from the first small expansion", Floor Rules section 148).
sealed:
- 1x rav-tournament
- 2x gpt-draft
prerelease-sealed:
  # "Cost of entry will provide you one (1) Ravnica: City of Guilds tournament
  # pack and three (3) Guildpact boosters."
  # Worldwide Prerelease Fact Sheet, Wizards of the Coast, 2005-12-06
  # https://web.archive.org/web/2018/https://magic.wizards.com/en/articles/archive/worldwide-prerelease-fact-sheet-2005-12-06
  boosters:
  - 1x rav-tournament
  - 3x gpt-draft
  unplayable-promo:
  - Djinn Illuminatus [PGPT:142★] [foil]
draft:
- rav-draft
- rav-draft
- gpt-draft
