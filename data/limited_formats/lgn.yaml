# Sealed in this set's season: the block's Onslaught tournament pack
# plus two boosters, which is the era's standard two (README, Sealed pools).
# Which two is derived, not sourced - no Grand Prix fact sheet survives for a
# mid-block season. Both are taken to be LGN, following the DCI's own
# set selection for team events, which puts every booster in the newest small
# set ("If the first small expansion has been released, the four boosters
# should be from the first small expansion", Floor Rules section 148).
sealed:
- 1x ons-tournament
- 2x lgn-draft
prerelease-sealed:
  # "an Onslaught tournament pack, three Legions booster packs, and a
  # commemorative foil prerelease card (you cannot use this card to build
  # your deck)"
  # https://magic.wizards.com/en/news/feature/legions-prerelease-primer
  boosters:
  - 1x ons-tournament
  - 3x lgn-draft
  unplayable-promo:
  - Feral Throwback [PLGN:126] [foil]
draft:
- ons-draft
- ons-draft
- lgn-draft
