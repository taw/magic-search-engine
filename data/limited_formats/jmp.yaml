# Jumpstart is the set the format is named after, and it is nothing but the
# format: 121 twenty-card themed half decks sold as boosters, with no draft or
# sealed product of its own. Two packs shuffled together are the entire event.
# The set name already says Jumpstart, so the format names itself.
# https://magic.wizards.com/en/news/feature/collecting-jumpstart-2020-06-25
jumpstart:
  name: "{set_name}"
  boosters:
  - 2x jmp-jumpstart
