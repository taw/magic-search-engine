# Sealed in this set's season, and the era's standard pool: the set's own
# tournament pack plus two of its own boosters (README, Sealed pools). The
# shape is sourced for Time Spiral, by the Grand Prix Athens fact sheet in
# tsp.yaml; no event sheet survives for this set's own season.
sealed:
- 1x rav-tournament
- 2x rav-draft
prerelease-sealed:
  # Unverified. Neither a primer nor a Worldwide Prerelease Fact Sheet for
  # this set is online - the fact sheets go back only to late 2005 and the
  # primers to 2003. Large sets got two boosters between 2003 and 2007
  # (mrd, tsp, lrw), so this is probably one booster too generous, but
  # Shards of Alara got three, so the rule cannot be applied unsourced.
  boosters:
  - 1x rav-tournament
  - 3x rav-draft
  unplayable-promo:
  - Gleancrawler [PRAV:247★] [foil]
draft:
- rav-draft
- rav-draft
- rav-draft
