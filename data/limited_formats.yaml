  # "Choose a Path": five boosters plus a seeded booster of your chosen path.
  # The stamped foil promo is inside the seeded booster.
  # The Hero card is oversized and not part of the pool.
  prerelease-sealed:
    choice: path
    variants:
      honor:
        boosters:
        - 5x ths-draft
