m15:
  sealed:
  - 6x m15-draft
  # "Hunt for the Rarest Beasts": five normal boosters plus a seeded booster
  # of the chosen hunt (and an oversized Garruk the Slayer, not modelled here).
  # The stamped foil promo sits inside the seeded booster.
  prerelease-sealed:
    choice: hunt
    variants:
      valor:
        boosters:
        - 5x m15-draft
        - 1x m15-prerelease-valor
      guile:
        boosters:
        - 5x m15-draft
