# Data from https://magic.wizards.com/en/news/feature/collecting-the-lord-of-the-rings-tales-of-middle-earth
pack:
  prerelease_promo: 1
  party_scene_promo: 1
sheets:
  prerelease_promo:
    # number<261 (not <=260): the stamped promos are suffixed "s" (e.g. 260s),
    # and "260s" sorts after bare "260", so number<=260 drops The Shire (pltr 260s).
    filter: "e:pltr number<261"
    foil: true
    use: rare_mythic
  party_scene_promo:
    foil: true
    filter: "e:pltr number:399-404"
    use: base_1248_by_rarity
