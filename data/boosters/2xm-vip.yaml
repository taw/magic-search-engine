# data from https://magic.wizards.com/en/news/feature/introducing-double-masters-vip-edition-2020-07-17
# Each VIP Edition has 33 cards (23 foil): the 12 full-art basics are
# 10 non-foil (one of each design, #373-382) plus 2 random traditional foil.
name: "{set_name} VIP Edition"
pack:
  # Each pair is RR or RM, never MM. Preserve 2:1 per-card R/M
  # marginals by making the second slot carry the pair's mythic chance.
  foil_borderless_rare: 1
  foil_borderless_second: 1
  foil_rare: 1
  foil_second: 1
  foil_uncommon: 8
  foil_common: 9
  plains_1: 1
  plains_2: 1
  island_1: 1
  island_2: 1
  swamp_1: 1
  swamp_2: 1
  mountain_1: 1
  mountain_2: 1
  forest_1: 1
  forest_2: 1
  foil_basic: 2
sheets:
  foil_borderless_rare:
    foil: true
    rawquery: "e:{set} is:borderless r:r"
    count: 20
  foil_borderless_second:
    foil: true
    any:
    - use: foil_borderless_rare
      chance: 1
    - rawquery: "e:{set} is:borderless r:m"
      count: 20
      chance: 2
  foil_second:
    foil: true
    any:
    - use: rare
      chance: 101
    - use: mythic
      chance: 40
  plains_1:
    rawquery: "e:{set} number:373"
    count: 1
  plains_2:
    rawquery: "e:{set} number:374"
    count: 1
  island_1:
    rawquery: "e:{set} number:375"
    count: 1
  island_2:
    rawquery: "e:{set} number:376"
    count: 1
  swamp_1:
    rawquery: "e:{set} number:377"
    count: 1
  swamp_2:
    rawquery: "e:{set} number:378"
    count: 1
  mountain_1:
    rawquery: "e:{set} number:379"
    count: 1
  mountain_2:
    rawquery: "e:{set} number:380"
    count: 1
  forest_1:
    rawquery: "e:{set} number:381"
    count: 1
  forest_2:
    rawquery: "e:{set} number:382"
    count: 1
  foil_basic:
    foil: true
    rawquery: "e:{set} t:basic"
    count: 10
