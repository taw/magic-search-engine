# https://media.wizards.com/2025/downloads/promo_packs/DFT_Promo_Pack_02062025.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pdft promo:promopack r:r
    use: rare_mythic
    foil: true
  curated:
    use: dft-promo.curated
    foil: true
  dark_frame:
    rawquery: e:dft promo:promopack
    count: 5
    foil: true
