# Data from youtube, e.g. https://www.youtube.com/watch?v=gnq3xpi0qWs&ab_channel=BadBoyGaming
name: "{set_name} Theme Booster Izzet"
filter: "e:{set} id<=izzet (is:baseset or promo:themepack) (w:Izzet or -w:*)"
pack:
  uncommon: 10
  common: 21
  variable:
  - common: 3
    chance: 1
  - common: 2
    uncommon: 1
    chance: 1
  - common: 1
    uncommon: 2
    chance: 1
  - uncommon: 3
    chance: 1
  rare_mythic: 1
sheets:
  common:
    duplicates: true
    any:
    - query: "r:c"
      count: 32
      rate: 1
    - query: "r:c -id:c"
      count: 31
      rate: 3
  uncommon:
    duplicates: true
    any:
    - query: "r:u"
      count: 22
      rate: 1
    - query: "r:u -id:c"
      count: 17
      rate: 3
  rare_mythic:
    any:
    - query: "r:r"
      count: 14
      rate: 2
    - query: "r:r -id:c"
      count: 12
      rate: 6
    - query: "r:m"
      count: 2
      rate: 1
    - query: "r:m -id:c"
      count: 2
      rate: 3
