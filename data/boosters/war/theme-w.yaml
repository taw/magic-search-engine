# data collected from youtube, e.g. https://www.youtube.com/watch?v=Bl5qBAYBpiY&ab_channel=TOTALmtg
name: "{set_name} Theme Booster White"
filter: "e:{set} (id<=w or (mana>h id>=w)) (is:baseset or promo:themepack) -variant:foreign"
pack:
  uncommon: 10
  common: 21
  variable:
  - common: 3
    chance: 1
  - common: 2
    uncommon: 1
    chance: 1
  - common: 1
    uncommon: 2
    chance: 1
  - uncommon: 3
    chance: 1
  rare_mythic: 1
sheets:
  common:
    duplicates: true
    any:
    - query: "r:c"
      count: 25
      rate: 1
    - query: "r:c -id:c"
      count: 19
      rate: 3
  uncommon:
    duplicates: true
    any:
    - query: "r:u"
      count: 18
      rate: 1
    - query: "r:u -id:c"
      count: 13
      rate: 3
  rare_mythic:
    any:
    - query: "r:r"
      count: 10
      rate: 2
    - query: "r:r -id:c"
      count: 5
      rate: 6
    - query: "r:m"
      count: 3
      rate: 1
    - query: "r:m -id:c"
      count: 3
      rate: 3
