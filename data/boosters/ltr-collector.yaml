# Data from https://magic.wizards.com/en/news/feature/collecting-the-lord-of-the-rings-tales-of-middle-earth
pack:
  foil_common: 3
  the_rings:
  # Article rates: non-foil Sol Ring ~0.65% total (Elven <0.1% / Dwarven <0.25% / Human <0.3%),
  # serialized Sol Ring ~0.065% total, The One Ring (1/1) <0.00003%; otherwise a foil common.
  - foil_common: 1
    chance: 9928497 # ~99.285% foil common (remainder)
  - nonfoil_sol_ring: 1
    chance: 65000 # 0.65% non-foil Sol Ring
  - serialized_sol_ring: 1
    chance: 6500 # 0.065% serialized Sol Ring
  - the_one_ring: 1
    chance: 3 # ~0.00003% The One Ring
  foil_uncommon: 2
  foil_basic: 1
  foil_rare_mythic: 1
  extended_core_rare_mythic: 1
  extended_jump_starter_rare_mythic: 1
  uncommon_showcase: 1
  rare_mythic_showcase: 1
  borderless_scene: 1
  foil_uncommon_showcase: 1
  finale:
  - foil_rare_mythic_showcase: 1
    chance: 992
  - surge_relic: 1
    chance: 8
sheets:
  foil_uncommon:
    foil: true
    query: 'r:u -name:"Nazgûl"'
    count: 79
  foil_basic:
    foil: true
    query: "r:b is:fullart"
    count: 10
  foil_rare_mythic:
    foil: true
    use: rare_mythic
  extended_core_rare_mythic:
    filter: "e:{set} frame:extendedart alt:(e:{set} is:baseset) number<=397"
    use: rare_mythic
  extended_jump_starter_rare_mythic:
    filter: "frame:extendedart ((e:{set} -alt:(e:{set} is:baseset)) or (e:ltc)) number<=397"
    use: rare_mythic
  uncommon_showcase:
    any:
    - rawquery: "e:{set} r:u frame:showcase -number>451"
      count: 10
      chance: 91
    - rawquery: 'e:{set} name:"Nazgûl" -number>451'
      count: 9
      chance: 9
  rare_mythic_showcase:
    any:
    - rawquery: "e:{set} r:r promo:boosterfun frame:showcase alt:(e:{set} is:borderless -frame:showcase) -is:foilonly -number:299-300 -number>451"
      count: 9
      rate: 2
    - rawquery: "e:{set} r:r promo:boosterfun frame:showcase -alt:(e:{set} is:borderless -frame:showcase) -number:299-300 -number>451"
      count: 5
      rate: 4
    - rawquery: "e:{set} r:m promo:boosterfun frame:showcase alt:(e:{set} is:borderless -frame:showcase) -is:foilonly -number:299-300 -number>451"
      count: 6
      rate: 1
    - rawquery: "e:{set} r:m promo:boosterfun frame:showcase -alt:(e:{set} is:borderless -frame:showcase) -number:299-300 -number>451"
      rate: 2
    - rawquery: "e:{set} r:r number:340-345 alt:(e:{set} number:399-451)"
      count: 2
      rate: 2
    - rawquery: "e:{set} r:r number:340-345 -alt:(e:{set} number:399-451)"
      count: 3
      rate: 4
    - rawquery: "e:{set} r:m number:340-345"
      count: 1
      rate: 2
    - rawquery: "e:ltc number:348-377"
      count: 30
      rate: 1
  borderless_scene:
    filter: "e:{set} number:399-451"
    any:
    - query: "r:c" # Commons
      count: 9
      chance: 375 # 37.5%
    - query: "r:u" # Uncommons
      count: 14
      chance: 292 # 29.2%
    - any: # Rare and mythics
      - query: "r:r -alt:(e:{set} number:302-331,340-345)"
        count: 10
        rate: 4
      - query: "r:r alt:(e:{set} number:302-331,340-345)"
        count: 11
        rate: 2
      - query: "r:m -alt:(e:{set} number:302-331,340-345)"
        count: 5
        rate: 2
      - query: "r:m alt:(e:{set} number:302-331,340-345)"
        count: 4
        rate: 1
      chance: 333 # 27.3% + 6%
  foil_uncommon_showcase:
    foil: true
    any:
    - rawquery: "e:{set} r:u frame:showcase -number>451"
      count: 10
      chance: 233
    - rawquery: "e:{set} r:c number:399-451"
      count: 9
      chance: 418
    - rawquery: "e:{set} r:u number:399-451"
      count: 14
      chance: 326
    - rawquery: 'e:{set} name:"Nazgûl" -number>451'
      count: 9
      chance: 23
  nonfoil_sol_ring:
    any:
    - rawquery: "e:ltc number:410"
      count: 1
      chance: 9
    - rawquery: "e:ltc number:409"
      count: 1
      chance: 7
    - rawquery: "e:ltc number:408"
      count: 1
      chance: 3
  serialized_sol_ring: # This currently doesn't work so just using the nonfoil sol rings
    foil: true
    any:
    - rawquery: "e:ltc number:410z"
      count: 1
      chance: 9
    - rawquery: "e:ltc number:409z"
      count: 1
      chance: 7
    - rawquery: "e:ltc number:408z"
      count: 1
      chance: 3
  the_one_ring:
    foil: true
    rawquery: "e:{set} number:0"
    count: 1
  foil_rare_mythic_showcase:
    foil: true
    any:
    - rawquery: "e:{set} r:r frame:showcase promo:boosterfun alt:(e:{set} number:399-451) -number:299-300 -number>451"
      count: 9
      rate: 2
    - rawquery: "e:{set} r:m frame:showcase promo:boosterfun alt:(e:{set} number:399-451) -number:299-300 -number>451"
      count: 4
      rate: 1
    - rawquery: "e:{set} r:r frame:showcase promo:boosterfun -alt:(e:{set} number:399-451) -number:299-300 -number>451"
      count: 5
      rate: 4
    - rawquery: "e:{set} r:m frame:showcase promo:boosterfun -alt:(e:{set} number:399-451) -number:299-300 -number>451"
      count: 2
      rate: 2
    - rawquery: "e:{set} r:r number:399-451 alt:(e:{set} number:302-331,340-345)"
      count: 11
      rate: 2
    - rawquery: "e:{set} r:m number:399-451 alt:(e:{set} number:302-331,340-345)"
      count: 4
      rate: 1
    - rawquery: "e:{set} r:r number:399-451 -alt:(e:{set} number:302-331,340-345)"
      count: 10
      rate: 4
    - rawquery: "e:{set} r:m number:399-451 -alt:(e:{set} number:302-331,340-345)"
      count: 5
      rate: 2
    - rawquery: "e:{set} r:r number:340-345 alt:(e:{set} number:399-451)"
      count: 2
      rate: 2
    - rawquery: "e:{set} r:r number:340-345 -alt:(e:{set} number:399-451)"
      count: 3
      rate: 4
    - rawquery: "e:{set} r:m number:340-345"
      count: 1
      rate: 2
    - rawquery: "e:ltc r:m frame:extendedart -number:378-407 -number>451"
      count: 8
      rate: 2
  surge_relic:
    foil: true
    rawquery: "e:ltc number:378-407 -number:/z/"
    count: 30
