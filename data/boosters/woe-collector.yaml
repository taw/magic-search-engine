# Data from https://magic.wizards.com/en/news/feature/collecting-wilds-of-eldraine
pack:
  foil_full_art_land: 1
  foil_common: 4
  foil_uncommon: 3
  enchanting_tales_uncommon: 1
  foil_enchanting_tales_uncommon: 1
  foil_rare_mythic: 1
  extended:
  - extended_art: 1
    chance: 895
  - foil_extended_art: 1
    chance: 105
  rare_mythic_showcase: 1
  enchanting_tales_rare_mythic: 1
  alt_frame_foil: 1
sheets:
  foil_full_art_land:
    foil: true
    query: "r:b number:262-266"
  enchanting_tales_uncommon:
    rawquery: "e:wot r:u number<=63"
  foil_enchanting_tales_uncommon:
    foil: true
    rawquery: "e:wot r:u number<=63"
  foil_rare_mythic:
    foil: true
    use: rare_mythic
  extended_art:
    filter: "(e:woe or e:woc) frame:extendedart -number:381"
    use: rare_mythic
  foil_extended_art:
    foil: true
    # The traditional-foil version of this slot also carries the new-to-Magic
    # Commander cards (woc #21-28) in regular frame, not just extended-art: the
    # article says it includes "the new Commander content found in Set Boosters".
    # Without number:21-28 their foils are productless.
    filter: "((e:woe or e:woc) frame:extendedart -number:381) or (e:woc number:21-28)"
    use: rare_mythic
  enchanting_tales_rare_mythic:
    any:
    - rawquery: "e:wot r:r -alt:(e:wot number:64-83) number<64"
      rate: 8
    - rawquery: "e:wot r:r alt:(e:wot number:64-83) number<64"
      rate: 6
    - rawquery: "e:wot r:r number:64-83"
      rate: 2
    - rawquery: "e:wot r:m -alt:(e:wot number:64-83) number<64"
      rate: 4
    - rawquery: "e:wot r:m alt:(e:wot number:64-83) number<64"
      rate: 3
    - rawquery: "e:wot r:m number:64-83"
      rate: 1
  alt_frame_foil:
    foil: true
    # Per the article, 2.8% of this slot is confetti foil (the 20 anime borderless
    # Enchanting Tales cards, wot #84-103: 5 rares = 1.1% + 15 mythics = 1.7%);
    # every other treatment in the slot appears in traditional foil (97.2%).
    any:
    - any:
      - use: rare_showcase
        rate: 12
      - rawquery: "(e:woe or e:woc) r:r frame:extendedart"
        rate: 12
      - rawquery: "e:wot r:r -alt:(e:wot number:64-83) number<64"
        rate: 12
      - rawquery: "e:wot r:r alt:(e:wot number:64-83) number<64"
        rate: 8
      - rawquery: "e:wot r:r number:64-83"
        rate: 4
      - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper (Kellan)"
        rate: 3
      - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -(Kellan or Birthright)"
        rate: 6
      - rawquery: "(e:woe or e:woc) r:m frame:extendedart"
        rate: 6
      - rawquery: "e:wot r:m -alt:(e:wot number:64-83) number<64"
        rate: 6
      - rawquery: "e:wot r:m alt:(e:wot number:64-83) number<64"
        rate: 4
      - rawquery: "e:wot r:m number:64-83"
        rate: 2
      chance: 972
    - rawquery: "e:wot r:r number:84-103"
      chance: 11
    - rawquery: "e:wot r:m number:84-103"
      chance: 17
  rare_mythic_showcase:
    any:
    - use: rare_showcase
      rate: 4
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper (Kellan)"
      rate: 1
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -(Kellan or Birthright)"
      rate: 2
