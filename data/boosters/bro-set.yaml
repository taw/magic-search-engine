# Data from https://magic.wizards.com/en/news/feature/whats-inside-the-brothers-war-boosters
# Assumptions
# Official rate for mech lands is 27%, but this fraction is cleaner and comes to 28%
# Shattered Glass is exclusive to Collector Boosters.
# Model one Transformer in 10% of packs; its foil share is assumed to be 1/3.
# The exact finish split and multi-Transformer collation are not published.
pack:
  basic_slot:
  - basic: 1
    chance: 4
  - foil_basic: 1
    chance: 1
  common: 3
  uncommon: 3
  transformers_slot:
  - wildcard: 2
    foil_with_showcase: 1
    chance: 27
  - wildcard: 1
    transformers: 1
    foil_with_showcase: 1
    chance: 2
  - wildcard: 2
    foil_transformers: 1
    chance: 1
  rare_mythic: 1
  brr_retro_artifact: 1
  finale:
  - chance: 3
  - the_list: 1
    chance: 1
sheets:
  common:
    query: "r:c"
    count: 101
  foil_with_showcase:
    # Copied from base set
    filter: "(e:{set} is:baseset -number:268-277) or (e:brr -number:/z/)"
    foil: true
    any:
    - query: "r<=c"
      count: 111
      chance: 12
    - query: "r:u"
      count: 116
      chance: 5
    - any:
      - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper"
        count: 6
        rate: 2
      - query: "r:r alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 6
        rate: 4
      - query: "r:r -alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 117
        rate: 6
      # foil versions of the commander (brc #1-28) and set-booster-exclusive
      # (#288-292) cards that the nonfoil wildcard carries but this foil slot was
      # missing (the slot filter is e:bro is:baseset, which excludes them);
      # rates are half the wildcard's, matching the rest of this foil slot
      - rawquery: "e:brc r:r number<=28"
        count: 6
        rate: 6
      - rawquery: "e:{set} number:288-292"
        count: 5
        rate: 6
      - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper"
        count: 2
        rate: 1
      - query: "r:m alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 2
        rate: 2
      - query: "r:m -alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 51
        rate: 3
      - rawquery: "e:brc r:m number<=28"
        count: 6
        rate: 3
      chance: 3
  basic:
    any:
    - rawquery: "e:{set} number:268-277"
      count: 10
      rate: 5
    - rawquery: "e:{set} number:278-287"
      count: 10
      rate: 2
  foil_basic:
    foil: true
    use: basic
  wildcard:
    any:
    - use: common
      chance: 700
    - any:
      - query: "r:u"
        count: 80
        rate: 6
      - rawquery: "e:brr r:u number<=63"
        count: 18
        rate: 5
      - rawquery: "e:brr r:u number>=64"
        count: 18
        rate: 1
      chance: 175
    - any:
      - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper"
        count: 6
        rate: 4
      - query: "r:r alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 6
        rate: 8
      - query: "r:r -alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 57
        rate: 12
      - rawquery: "e:brr r:r number<=63"
        count: 30
        rate: 10
      - rawquery: "e:brr r:r number>=64"
        count: 30
        rate: 2
      - rawquery: "e:brc r:r number<=28"
        count: 22
        rate: 12
      - rawquery: "e:{set} number:288-292"
        count: 5
        rate: 12
      - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper"
        count: 2
        rate: 2
      - query: "r:m alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 2
        rate: 4
      - query: "r:m -alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart)"
        count: 21
        rate: 6
      - rawquery: "e:brr r:m number<=63"
        count: 15
        rate: 5
      - rawquery: "e:brr r:m number>=64"
        count: 15
        rate: 1
      - rawquery: "e:brc r:m number<=28"
        count: 6
        rate: 6
      chance: 125
  transformers:
    rawquery: "e:bot number<16"
    count: 15
  foil_transformers:
    foil: true
    use: transformers
  brr_retro_artifact:
    filter: "e:brr -number:/z/"
    any:
    # Rarity and schematic probabilities published in the collecting guide.
    - any:
      - query: "r:u"
        chance: 66
      - query: "r:r"
        chance: 27
      - query: "r:m"
        chance: 7
      filter: "e:brr -number:/z/ number<=63"
      chance: 5
    - any:
      - query: "r:u"
        chance: 66
      - query: "r:r"
        chance: 27
      - query: "r:m"
        chance: 7
      filter: "e:brr -number:/z/ number>=64"
      chance: 1
  the_list:
    any:
    - set: plst
      code: "BRO"
      rate: 1
    - set: slx
      code: "BRO"
      rate: 1
