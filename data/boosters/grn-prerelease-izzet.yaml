# Eight guild-specific promos (seven rares and one mythic):
# https://www.mtgsalvation.com/forums/magic-fundamentals/the-rumor-mill/228617-compiled-upcoming-promo-information
# Keep the existing 2:1 per-card rare/mythic weighting; historical odds are unverified.
# Common/uncommon pools and seeded collation remain approximate and unchanged.
name: "{set_name} Seeded Prerelease Booster Izzet"
filter: "e:{set} id<=ur is:baseset (w:izzet or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 31
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn number:207s promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn (number:51s or number:224sa or number:171s or number:113s or number:179s or number:115s or number:192s) promo:prerelease"
      count: 7
      rate: 2
