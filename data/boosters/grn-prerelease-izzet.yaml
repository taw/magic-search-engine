# Include Thousand-Year Storm (207s), whose story watermark is not Izzet.
# Exact eight-promo guild collation and odds remain unverified; retain the existing pool.
# Guilds of Ravnica -- seeded prerelease Guild Booster (Izzet).
# Guilds of Ravnica prerelease kits were seeded by guild: a ~15-card guild-colored pile
# (11 common + 3 uncommon) plus the folded, guild-colored foil year-stamped promo
# (using the repository 2:1 per-card rare/mythic convention). Seeded via the wedge/guild idiom -- cards in the guild's colors carrying
# the guild watermark or no watermark, excluding generic colorless. Matches the RTR/GTC model.
name: "{set_name} Seeded Prerelease Booster Izzet"
filter: "e:{set} id<=ur is:baseset (w:izzet or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 31
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn number:207s promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn r:r (w:izzet or (id<=ur and -w:*)) promo:prerelease"
      count: 8
      rate: 2
