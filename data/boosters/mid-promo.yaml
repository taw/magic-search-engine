# https://media.wizards.com/2021/downloads/promo_packs/MID_Promo_Pack_09162021-2.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pmid promo:promopack r>=r -is:dfc -is:meld
    use: rare_mythic
    foil: false
  curated:
    count: 121
    any:
