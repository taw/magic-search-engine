# https://media.wizards.com/2019/downloads/promo_packs/ELD_Promo_Pack_10022019.pdf
# Seasonal slot uses the conventional 2:1 per-card rare/mythic weights.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The fourth physical card is an Arena code, not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:peld promo:promopack r>=r
    use: rare_mythic
    foil: true
  curated:
    count: 121
    any:
    - rawquery: e:pgrn number:69p,77p,91p,113p,123p,152p,183p,192p,205p,224pa,233p,253p,254p,257p,258p,259p
      count: 16
      rate: 1
    - rawquery: e:pm20 number:8p,22p,26p,33p,36p,39p,43p,52p,56p,57p,59p,77p,94p,96p,98p,105p,106p,113p,122p,126p,127p,131p,136p,141p,150p,156p,162p,169p,172p,193p,194p,199p,200p,216p,226p,229p,233p,239p,247p,249p,253p,254p,255p,256p,257p
      count: 45
      rate: 1
    - rawquery: e:prna number:11p,22p,27p,76p,83p,99p,128p,131p,151p,157p,161p,165p,179p,183p,185p,186p,187p,205p,212p,245p,246p,248p,251p,254p,259p
      count: 25
      rate: 1
    - rawquery: e:pwar number:2p,13p,34p,45p,50p,51p,54p,68p,86p,89p,91p,119p,125p,137p,138p,160p,169p,180p,184p,194p,196p,203p,207p,209p,211p,216p,217p,218p,219p,221p,223p,224p,226p,248p,249p
      count: 35
      rate: 1
    foil: true
  dark_frame:
    rawquery: e:eld number:393-397
    count: 5
    foil: true
