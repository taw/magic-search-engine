# Data from https://magic.wizards.com/en/news/feature/innistrad-crimson-vow-product-overview-2021-10-28
# Assume that showcase and dfc cards in common/uncommon slot are equally likely
pack:
  basic_slot:
  - basic: 1
    chance: 17
  - foil_basic: 1
    chance: 3
  sfc_common: 3
  sfc_uncommon: 2
  showcase_common_uncommon: 2
  wildcard: 2
  rare_mythic: 1
  finale:
  - foil_with_showcase: 1
    chance: 3
  - foil_with_showcase: 1
    the_list: 1
    chance: 1
sheets:
  sfc_common:
    query: "r:c is:sfc"
    count: 90
  showcase_common_uncommon:
    any:
    - rawquery: "e:{set} r:c promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
      count: 7
      rate: 2
    - rawquery: "e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
      count: 10
      rate: 1
    - use: dfc_common
      rate: 2
    - use: dfc_uncommon
      rate: 1
  wildcard:
    any:
    - use: common
      chance: 700
    - use: uncommon
      chance: 175
    - any:
      - any:
        - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
          count: 25
          rate: 1
        - query: "r:r alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
          count: 24
          rate: 2
        - query: "r:r -alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
          count: 40
          rate: 3
        chance: 64*2
      - any:
        - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
          count: 9
          rate: 1
        - query: "r:m alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
          count: 8
          rate: 2
        - query: "r:m -alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
          count: 12
          rate: 3
        chance: 20
      # Only the 8 new-to-Commander cards designed for Set Boosters appear
      # here (VOC #31-38: 6 rares + 2 mythics -- the Soulbonders cycle,
      # Hollowhenge Overlord, Wedding Ring, Umbris). The rest of VOC (the
      # Commander-deck cards) are NOT in Set Boosters. Per-card weight kept
      # at rare 2 : mythic 1, matching the main-set R/M tier.
      - rawquery: "e:voc number:31-38 r:r"
        count: 6
        chance: 6*2
      - rawquery: "e:voc number:31-38 r:m"
        count: 2
        chance: 2
      chance: 125
  the_list:
    any:
    - set: plst
      code: "VOW"
      rate: 1
    - query: 'e:cmb1 (name:"Kaya, Ghost Haunter" or name:"Puresteel Angel")'
      rate: 1
  foil_with_showcase:
    foil: true
    any:
    - any:
      - rawquery: "e:{set} r:c promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
        count: 7
        rate: 1
      - query: "r:c alt:(e:{set} r:c promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 7
        rate: 2
      - query: "r:c -alt:(e:{set} r:c promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 93
        rate: 3
      - use: basic
        rate: 3
      chance: 12
    - any:
      - rawquery: "e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
        count: 10
        rate: 1
      - query: "r:u alt:(e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 10
        rate: 2
      - query: "r:u -alt:(e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 73
        rate: 3
      chance: 5
    - any:
      - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
        count: 25
        rate: 2
      - query: "r:r alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 24
        rate: 4
      - query: "r:r -alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 40
        rate: 6
      - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -promo:draculaseries"
        count: 9
        rate: 1
      - query: "r:m alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 8
        rate: 2
      - query: "r:m -alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart -promo:draculaseries)"
        count: 12
        rate: 3
      chance: 3
