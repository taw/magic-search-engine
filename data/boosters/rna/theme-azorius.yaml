# Data from youtube, e.g. https://www.youtube.com/watch?v=gnq3xpi0qWs&ab_channel=BadBoyGaming
name: "{set_name} Theme Booster Azorius"
filter: "e:{set} id<=Azorius (is:baseset or promo:themepack) (w:Azorius or -w:*)"
pack:
  uncommon: 10
  common: 21
  variable:
  - common: 3
    chance: 1
  - common: 2
    uncommon: 1
    chance: 1
  - common: 1
    uncommon: 2
    chance: 1
  - uncommon: 3
    chance: 1
  # Source (unboxings): a theme booster may contain one OR two rares/mythics;
  # the rate of a second is undocumented, so exactly 1 is modeled here.
  rare_mythic: 1
sheets:
  common:
    duplicates: true
    any:
    - query: "r:c"
      count: 34
      rate: 1
    - query: "r:c -id:c"
      count: 33
      rate: 3
  uncommon:
    duplicates: true
    any:
    - query: "r:u"
      count: 25
      rate: 1
    - query: "r:u -id:c"
      count: 21
      rate: 3
  rare_mythic:
    any:
    - query: "r:r"
      count: 16
      rate: 2
    - query: "r:r -id:c"
      count: 13
      rate: 6
    - query: "r:m"
      count: 3
      rate: 1
    - query: "r:m -id:c"
      count: 3
      rate: 3
