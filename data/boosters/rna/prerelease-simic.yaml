# Ravnica Allegiance -- seeded prerelease Guild Booster (Simic).
# Ravnica Allegiance prerelease kits were seeded by guild: a ~15-card guild-colored pile
# (11 common + 3 uncommon) plus the folded, guild-colored foil year-stamped promo
# (2:1 rare:mythic). Seeded via the wedge/guild idiom -- cards in the guild's colors carrying
# the guild watermark or no watermark, excluding generic colorless. Matches the RTR/GTC model.
name: "{set_name} Seeded Prerelease Booster Simic"
filter: "e:{set} id<=gu is:baseset (w:simic or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 33
  # Wizards specifies eight promos per guild; the stamped inventory has 40 cards.
  # Guild affiliation plus observed unwatermarked promos constrains the assignments.
  # Assumes the 40-card inventory is complete and guild pools do not overlap.
  # https://magic.wizards.com/en/news/feature/ravnica-allegiance-prerelease-primer
  # https://forum.metagame.info/t/rna-ravnica-allegiance-draft-sealed/17507/6
  # Existing 2:1 per-card rare/mythic weights remain estimates.
  promo:
    foil: true
    any:
    - rawquery: "e:prna promo:prerelease cn:183s"
      count: 1
      rate: 1
    - rawquery: "e:prna promo:prerelease cn:32s,128s,130s,131s,158s,207s,214s"
      count: 7
      rate: 2
