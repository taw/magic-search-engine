# Urza's Saga Tournament Deck: 30 basics / 32 commons / 10 uncommons / 3 rares.
# Urza's Saga is the set that replaced 60-card starter decks with the 75-card
# tournament pack.
#
# Confirmed by this opening https://www.youtube.com/watch?v=_b6AphFe4QY -- 10
# uncommons, 32 commons, 3 rares and no foils. The basics were not counted, so the
# 30 here is the remainder of the 75-card pack rather than an observed figure,
# but it matches every other tournament pack.
#
# This is the only direct evidence for the composition: lethe has a page for the
# set but notes "although they exist, I have not observed any US tournament packs"
# (https://lethe.xyz/mtg/collation/usg.html), so the numbers here were previously
# only inferred from the neighbouring sets.
#
# No foils, as expected -- Urza's Saga (October 1998) predates the introduction of
# foils in Urza's Legacy (February 1999), and the video confirms it.
name: "{set_name} Tournament Deck"
pack:
  basic_with_duplicates: 30
  common_with_duplicates: 32
  uncommon_with_duplicates: 10
  rare: 3
sheets:
  basic_with_duplicates:
    duplicates: true
    use: basic
  common_with_duplicates:
    duplicates: true
    query: "r:c"
    count: 110
  uncommon_with_duplicates:
    duplicates: true
    use: uncommon
