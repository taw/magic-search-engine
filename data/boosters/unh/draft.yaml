# Super Secret Tech has number 141/140
# Languages, per the WotC Card Set Archive product information for this set:
# https://web.archive.org/web/2014/http://magic.wizards.com/en/game-info/products/card-set-archive/unhinged
# "Languages: English"
languages: en

filter: "e:{set}"
pack:
- basic: 1
  common: 10
  uncommon: 3
  rare_mythic: 1
  chance: 31
- basic: 1
  common: 9
  uncommon: 3
  rare_mythic: 1
  unhinged_foil: 1
  chance: 9
sheets:
  unhinged_foil:
    foil: true
    any:
      - query: "r<=c"
        count: 60
        chance: 12
      - query: "r:u"
        count: 40
        chance: 5
      - query: "r>=r"
        count: 40 + 1 # 40 normal rares + 1 super secret tech
        chance: 3
