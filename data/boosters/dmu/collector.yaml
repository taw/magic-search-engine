# Data from https://magic.wizards.com/en/news/feature/dominaria-united-product-overview-2022-08-18
# Lost Legends rate set at 3%, exact rate is unknown
# The Retold uncommon is evenly split between nonfoil and etched, with at most
# two etched cards per pack. Preserve the previous conditional distribution of
# the other two slots; their exact joint collation is not published.
pack:
  foil_fullart_land: 1
  lost_legends_slot:
  - foil_common: 4
    chance: 97
  - foil_common: 3
    lost_legends: 1
    chance: 3
  foil_uncommon: 2
  foil_rare_mythic: 1
  extended_rare_mythic: 1
  foil_uncommon_showcase: 1
  foil_alt_border_rare_mythic: 1
  etched_cards:
  - retold_uncommon: 1
    showcase_rare_mythic: 2
    chance: (5 + 2*81) * 300
  - etched_retold_uncommon: 1
    showcase_rare_mythic: 2
    chance: (5 + 2*81) * 399
  - retold_uncommon: 1
    etched_retold_rare_mythic: 1
    showcase_rare_mythic: 1
    chance: (5 + 81 + 47) * 300
  - etched_retold_uncommon: 1
    etched_retold_rare_mythic: 1
    showcase_rare_mythic: 1
    chance: (5 + 81 + 47) * 399
  - retold_uncommon: 1
    etched_retold_rare_mythic: 2
    chance: (5 + 2*47) * 300
  textured_foil: 1
sheets:
  foil_fullart_land:
    foil: true
    query: "r:b is:fullart"
    count: 5
  foil_rare_mythic:
    foil: true
    use: rare_mythic
    count: 80
  foil_uncommon_showcase:
    foil: true
    use: uncommon_showcase
    count: 20
  extended_rare_mythic:
    filter: "(e:{set} or e:dmc) frame:extendedart -promo:buyabox"
    use: rare_mythic
    count: 71
  lost_legends:
    set: leg
    code: "LL"
  foil_alt_border_rare_mythic:
    foil: true
    filter: "e:{set} promo:boosterfun -is:foilonly number<=430"
    use: rare_mythic
    count: 75
  retold_uncommon:
    rawquery: "e:dmc number:29-48 r:u"
    count: 5
  etched_retold_uncommon:
    foil: true
    etched: true
    rawquery: "e:dmc is:etched r:u"
    count: 5
  etched_retold_rare_mythic:
    foil: true
    etched: true
    filter: "e:dmc is:etched alt:(e:dmc number:29-48)"
    use: rare_mythic
    count: 15
  showcase_rare_mythic:
    filter: "(e:{set} promo:boosterfun -is:foilonly -frame:extendedart number<=430) or (e:dmc number:29-48)"
    use: rare_mythic
    count: 50
  textured_foil:
    foil: true
    filter: "e:{set} promo:textured"
    any:
    - query: "r:u"
      count: 20
      chance: 631
    - query: "r:r"
      count: 14
      chance: 295
    - query: "r:m"
      count: 7
      chance: 74
