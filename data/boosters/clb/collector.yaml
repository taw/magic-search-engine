# Data from https://magic.wizards.com/en/news/feature/commander-legends-battle-for-baldurs-gate-product-overview
# Languages, per https://wpn.wizards.com/en/news/commander-legends-battle-baldurs-gate-retail-guide:
# "Collector Boosters ... Languages available: English, German, French, Japanese"
languages: de, en, fr, jp

pack:
  foil_basic: 1
  foil_common: 3
  foil_uncommon: 2
  foil_common_uncommon_showcase: 1
  foil_common_uncommon_legendary: 1
  foil_rare_mythic: 1
  extended_commander: 1
  extended_rare_mythic: 1
  rare_mythic_showcase: 1
  etched_common_uncommon: 1
  etched_rare_mythic: 1
  foil_showcase_rare_mythic: 1
sheets:
  foil_basic:
    foil: true
    rawquery: "e:{set} t:basic"
    count: 20
  foil_common_uncommon_legendary:
    foil: true
    filter: "e:{set} t:legendary is:baseset"
    use: common_uncommon
    count: 50
  extended_commander:
    filter: "e:{set} number:607-645"
    use: rare_mythic
    count: 39
  extended_rare_mythic:
    filter: "e:{set} number:553-606"
    use: rare_mythic
    count: 93-39
  etched_common_uncommon:
    foil: true
    etched: true
    filter: "e:{set} is:etched"
    use: common_uncommon
    count: 50
  etched_rare_mythic:
    foil: true
    etched: true
    filter: "e:{set} is:etched number<=552"
    use: rare_mythic
    count: 32
  foil_showcase_rare_mythic:
    foil: true
    filter: "e:{set} promo:boosterfun -is:foilonly"
    use: rare_mythic
  foil_rare_mythic:
    foil: true
    use: rare_mythic
