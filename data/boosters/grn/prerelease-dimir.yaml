# Common/uncommon pools and seeded collation remain approximate and unchanged.
name: "{set_name} Seeded Prerelease Booster Dimir"
filter: "e:{set} id<=ub is:baseset (w:dimir or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 34
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn number:184s promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn (number:170s or number:222sa or number:44s or number:84s or number:63s or number:47s or number:205s) promo:prerelease"
      count: 7
      rate: 2
