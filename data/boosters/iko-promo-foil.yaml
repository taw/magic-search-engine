# https://media.wizards.com/2020/downloads/promo_packs/IKO_Promo_Pack_04172020.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:piko promo:promopack r>=r
    use: rare_mythic
    foil: true
  curated:
    use: iko-promo.curated
    foil: true
  dark_frame:
    rawquery: e:iko promo:promopack
    count: 5
    foil: true
