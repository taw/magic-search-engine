# Contents and Lesson frequency: https://magic.wizards.com/en/news/feature/collecting-strixhaven-school-mages-2021-03-25
# Languages, per https://wpn.wizards.com/en/news/whats-inside-each-strixhaven-product:
# "Collector Boosters are available in English, French, German, Italian, Japanese, and Spanish."
languages: de, en, fr, it, jp, sp

pack:
  foil_common: 5
  foil_uncommon: 2
  foil_rare_mythic: 1
  foil_lesson: 1
  extended_commander: 1
  extended_or_borderless_core: 1
  foil_sta_uncommon: 1
  foil_alt_art_wild: 1
  etched_slots:
  - etched_sta_uncommon: 1
    etched_jp_sta_rare_mythic: 1
    chance: 1
  - etched_jp_sta_uncommon: 1
    etched_sta_rare_mythic: 1
    chance: 1
sheets:
  foil_common:
    foil: true
    query: "r:c -t:lesson"
    count: 96
  foil_uncommon:
    foil: true
    query: "r:u -t:lesson"
    count: 75
  foil_rare_mythic:
    foil: true
    filter: "e:{set} is:baseset -t:lesson"
    use: rare_mythic
    count: 84
  foil_lesson:
    # Collecting Strixhaven: one R/M Lesson per six Collector Boosters.
    # Within C/U and R/M, retain the conventional 2:1 per-card rarity weights.
    filter: "e:{set} t:lesson is:baseset"
    foil: true
    any:
    - use: common_uncommon
      chance: 5
    - use: rare_mythic
      chance: 1
  extended_commander:
    filter: "e:c21 frame:extendedart"
    use: rare_mythic
  extended_or_borderless_core:
    filter: "e:{set} promo:boosterfun"
    use: rare_mythic
  foil_sta_uncommon:
    foil: true
    rawquery: "e:sta r:u"
    count: 36
  foil_alt_art_wild:
    foil: true
    filter: "(e:{set} promo:boosterfun) or (e:sta)"
    use: rare_mythic
  etched_sta_uncommon:
    foil: true
    etched: true
    rawquery: "e:sta r:u -variant:foreign is:etched"
    count: 18
  etched_sta_rare_mythic:
    foil: true
    etched: true
    filter: "e:sta is:etched -variant:foreign"
    use: rare_mythic
    count: 45
  etched_jp_sta_uncommon:
    foil: true
    etched: true
    rawquery: "e:sta r:u variant:foreign is:etched"
    count: 18
  etched_jp_sta_rare_mythic:
    foil: true
    etched: true
    filter: "e:sta variant:foreign is:etched"
    use: rare_mythic
    count: 45
