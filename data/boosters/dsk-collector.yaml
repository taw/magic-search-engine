# Data from https://magic.wizards.com/en/news/feature/collecting-duskmourn
pack:
  foil_common: 5
  foil_uncommon: 4
  foil_basic: 1
  foil_rare_mythic: 1
  commander:
  - showcase_commander: 1
    chance: 16 + 108
  - foil_showcase_commander: 1
    chance: 8
  booster_fun: 2
  foil_booster_fun: 1
queries:
  lurking_evil: "e:{set} number:287-301"
  showcase: "e:{set} number:302-327"
  borderless: "e:{set} number:328-350"
  double_exposure: "e:{set} number:351-367"
  extended_art: "e:{set} frame:extendedart"
  any_boosterfun: "{extended_art} or {showcase} or {borderless} or {double_exposure}"
  two_instances: "{any_boosterfun} ((alt:{extended_art} alt:{showcase}) or (alt:{extended_art} alt:{borderless}) or (alt:{extended_art} alt:{double_exposure}) or (alt:{showcase} alt:{borderless}) or (alt:{showcase} alt:{double_exposure}) or (alt:{borderless} alt:{double_exposure}))"
sheets:
  foil_common:
    # All common printings, including dual lands and lurking evil, appear evenly.
    foil: true
    rawquery: "e:{set} r:c (is:baseset or number:287-301) -t:basic"
    count: 93
  foil_uncommon:
    # Main-set, paranormal-frame, and lurking-evil printings appear evenly.
    foil: true
    rawquery: "e:{set} r:u (is:baseset or number:287-327)"
    count: 108
  foil_basic:
    foil: true
    query: "t:basic is:fullart"
    count: 5
  foil_rare_mythic:
    # Lurking-evil printings have the same rate as other cards of their rarity.
    foil: true
    any:
    - rawquery: "e:{set} r:r (is:baseset or number:287-301)"
      count: 67
      rate: 2
    - rawquery: "e:{set} r:m (is:baseset or number:287-301)"
      count: 22
      rate: 1
  showcase_commander:
    any:
    - rawquery: "e:dsc number<=8"
      count: 8
      rate: 1
    - rawquery: "e:dsc frame:extendedart"
      count: 27
      rate: 2
  foil_showcase_commander:
    foil: true
    rawquery: "e:dsc number<=8"
    count: 8
  booster_fun:
    any:
    - rawquery: "r:m {two_instances}"
      count: 2
      rate: 1
    - rawquery: "r:m {any_boosterfun} -alt:{two_instances}"
      count: 19
      rate: 2
    - rawquery: "r:r {two_instances} -number:417" # 417 is the BaB
      rate: 2
    - rawquery: "r:r {any_boosterfun} -alt:{two_instances} -number:417"
      count: 59
      rate: 4
  foil_booster_fun:
    foil: true
    any:
    - use: booster_fun
      chance: 859
    - rawquery: "e:{set} number:386-395"
      count: 10
      chance: 90
    - rawquery: "e:{set} number:396-405"
      count: 10
      chance: 10
    - rawquery: "e:{set} number:406-410"
      count: 5
      chance: 10
    - set: spg
      code: "DSK"
      chance: 31
