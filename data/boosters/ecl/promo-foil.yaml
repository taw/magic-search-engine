# https://media.wizards.com/2026/downloads/promo_packs/ECL_Promo_Pack_01162026.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    use: ecl-promo.seasonal
    foil: true
  curated:
    use: ecl-promo.curated
    foil: true
  dark_frame:
    use: ecl-promo.dark_frame
    foil: true
