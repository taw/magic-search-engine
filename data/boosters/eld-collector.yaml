# data from https://magic.wizards.com/en/news/making-magic/project-booster-fun-2019-07-20
# and https://www.lethe.xyz/mtg/collation/eld.html
# Assumptions:
# No data for distribution of commons/uncommons
# - assumed to follow distribution of Set boosters in https://mtg.wiki/wiki/Set_Booster
# - with one extra guaranteed common and one guaranteed uncommon
# No data for relative showcase rarity for showcase slot
# - Showcase treatments tend to use 8/4/2/1 rarity
# No data for relative rarity of ancillary cards
# - Cards are not nicely distributed, so used bonus sheet 8/4/2/1 rates
# Languages, per https://magic.wizards.com/en/news/making-magic/project-booster-fun-2019-07-20:
# "The Collector Booster is currently only being printed in English and Japanese."
languages: en, jp

pack:
  common_or_uncommon:
  - foil_common: 7
    foil_uncommon: 2
    chance: 350
  - foil_common: 6
    foil_uncommon: 3
    chance: 400
  - foil_common: 5
    foil_uncommon: 4
    chance: 125
  - foil_common: 4
    foil_uncommon: 5
    chance: 70
  - foil_common: 3
    foil_uncommon: 6
    chance: 35
  - foil_common: 2
    foil_uncommon: 7
    chance: 20
  any_showcase: 3
  ancillary: 1
  rm_extended: 1
  foil_rare_mythic: 1
sheets:
  # Showcase foil availability is confirmed; 1/3 substitution uses the existing
  # showcase-sheet convention, not a published Collector-specific rate.
  foil_common:
    foil: true
    balanced: false
    use: common_with_showcase
    count: 14 + 14 + 87
  foil_uncommon:
    foil: true
    use: uncommon_with_showcase
    count: 71 + 9 + 9
  ancillary:
    # C/U/R/M rates guessed to be at 8x/4x/2x/1x multiples
    filter: "e:{set} -promo:boosterfun number>=303 -frame:inverted"
    use: base_1248_by_rarity
  rm_extended:
    filter: "e:{set} frame:extendedart"
    use: rare_mythic
  foil_rare_mythic:
    foil: true
    any:
    - query: "r:r"
      count: 53
      rate: 4
    - rawquery: "e:{set} r:r promo:boosterfun"
      count: 53
      rate: 2
    - query: "r:m"
      count: 15
      rate: 2
    - rawquery: "e:{set} r:m promo:boosterfun"
      count: 15
      rate: 1
    - rawquery: "e:{set} r:r -promo:boosterfun number>=304 -frame:inverted"
      count: 1
      rate: 4
    - rawquery: "e:{set} r:m -promo:boosterfun number>=304 -frame:inverted"
      count: 6
      rate: 2
