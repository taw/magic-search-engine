# data from https://magic.wizards.com/en/news/feature/collecting-modern-horizons-3
pack:
- foil_common: 4
  foil_uncommon: 3
  foil_eldrazi_land: 1
  retro_cu: 1
  foil_retro_cu: 1
  foil_rare_mythic: 1
  showcase_commander_slot:
  - showcase_commander: 1
    chance: 903
  - showcase_commander_foil: 1
    chance: 98
  showcase_rm: 2
  foil_showcase_rm: 1
queries:
  # The Booster Fun treatments, by collector number: 320-361 borderless,
  # 362-380 borderless profile, 381-383 concept Eldrazi, 384-441 '97 retro frame,
  # 442-446a flip walkers, 447-467 extended art. Cards are weighted so that every
  # rare totals 12 and every mythic 6 no matter how many of these a card got, so
  # the slots below split by how many there are. A foil-only printing can never
  # come out of these slots, so it isn't one of the versions being counted.
  versions: "e:{set} number:320-467 -is:foilonly"
sheets:
  foil_eldrazi_land:
    foil: true
    rawquery: "e:{set} number:304-308"
    count: 5
  retro_cu:
    # Article slot 9/10: retro commons 30.7%, retro uncommons 31.6%, new-to-Modern
    # retro uncommons 10.5%, H2R commons 8.8%, H2R uncommons 15.8%, Wastes 2.6%.
    # That is a 5:3 common:uncommon ratio per card, not 2:1.
    any:
    - rawquery: "e:{set} r:u number:384-441"
      count: 16
      rate: 3
    - rawquery: "e:{set} r:c number:384-441"
      count: 7
      rate: 5
    - rawquery: "e:{set} number:309"
      count: 1
      rate: 3
    - rawquery: "e:h2r r:u"
      count: 6
      rate: 3
    - rawquery: "e:h2r r:c"
      count: 2
      rate: 5
  foil_retro_cu:
    foil: true
    use: retro_cu
  foil_rare_mythic:
    foil: true
    any:
    - query: "r:r"
      rate: 2
      count: 60 + 18
    - query: "r:m"
      rate: 1
      count: 15 + 5 + 4
  showcase_commander:
    any:
    - rawquery: "e:m3c number:9-16"
      rate: 1
      count: 8
      # nonfoil borderless mythic 6.1% 8
    - rawquery: "e:m3c number:25-31"
      rate: 1
      count: 7
      # nonfoil extended mythic 5.3% 7
    - rawquery: "e:m3c r:r (frame:extendedart or number<152 deck:\"eldrazi incursion\")"
      rate: 2
      count: 52
      # nonfoil extended rare 78.9% 52
  showcase_commander_foil:
    foil: true
    rawquery: "e:m3c number:9-31"
    count: 23
    # foil etched 3.3% 8
    # foil borderless 3.5% 8
    # foil extended 3% 7
  showcase_rm:
    any:
    - # two versions mythic
      rawquery: "{versions} r:m prints>=2:{versions}"
      count: 14
      rate: 3
    - # one version mythic
      rawquery: "{versions} r:m prints=1:{versions}"
      count: 17
      rate: 6
    - # three versions rare
      rawquery: "{versions} r:r prints>=3:{versions}"
      count: 15
      rate: 4
    - # two versions rare
      rawquery: "{versions} r:r prints=2:{versions}"
      count: 36
      rate: 6
    - # one version rare
      rawquery: "{versions} r:r prints=1:{versions}"
      count: 43
      rate: 12
    - rawquery: "e:h2r r:m"
      count: 6
      rate: 6
    - rawquery: "e:h2r r:r"
      count: 2
      rate: 12
  foil_showcase_rm:
    # Article slot 15. Sub-chances are the published percentages x10:
    #   showcase R/M 78.6 - foil-etched rare 9.3 - foil-etched mythic 3.9
    #   - Special Guests 4.4 - textured SPG Elemental 1.9 - textured DFC walker 1.9
    # The showcase pool is the one slots 13-14 draw from, in foil, so it is reused
    # rather than duplicated; it keeps its equiprobable 12-per-rare / 6-per-mythic
    # weighting.
    foil: true
    any:
    # Serialized titans are chance 1 against 1999 -> 0.05% of the slot, so each of
    # the three is 1 in 6000 boosters.
    - chance: 1999
      any:
      - use: showcase_rm
        chance: 786
      - rawquery: "e:{set} is:etched r:r"
        count: 12
        etched: true
        chance: 93
      - rawquery: "e:{set} is:etched r:m"
        count: 10
        etched: true
        chance: 39
      - set: spg
        code: "MHTHREE"
        chance: 44
      - set: spg
        code: "MHTHREECOLLECTOR"
        chance: 19
      - rawquery: "e:{set} number:468-472"
        count: 5
        chance: 19
    - chance: 1
      rawquery: "e:{set} number:381-383 number:/z/"
      count: 3
