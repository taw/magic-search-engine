# Data from https://magic.wizards.com/en/news/feature/collecting-double-masters-2022-and-product-overview
pack:
  cryptic_spires: 1
  common_with_showcase: 8
  uncommon_with_showcase: 3
  rare_mythic_with_showcase: 2
  dedicated_foil_double_masters: 2
sheets:
  cryptic_spires:
    rawquery: "e:{set} number:332"
    count: 1
  rare_mythic_with_showcase:
    # Independent 5.66% borderless draws give approximately 11% per two-slot pack.
    any:
    - use: rare_mythic
      chance: 9434
    - use: rare_mythic_showcase
      chance: 566
  dedicated_foil_double_masters:
    foil: true
    any:
    - use: common_with_showcase
      chance: 8
    - use: uncommon_with_showcase
      chance: 3
    # This rarity tier occupies 2/13 of the foil slot; 13/160 within it is 1.25% overall.
    - any:
      - use: rare_mythic
        chance: 147
      - use: rare_mythic_showcase
        chance: 13
      chance: 2
