# Data from youtube, e.g. https://www.youtube.com/watch?v=gnq3xpi0qWs&ab_channel=BadBoyGaming
# Languages, per https://wpn.wizards.com/en/news/whats-inside-each-strixhaven-product:
# "Strixhaven Theme Boosters are available in English, French, and German."
languages: de, en, fr

name: "{set_name} Theme Booster Prismari"
filter: "e:{set} id<=izzet (is:baseset or promo:themepack) (w:Prismari or -w:*)"
pack:
  uncommon: 10
  common: 21
  variable:
  - common: 3
    chance: 1
  - common: 2
    uncommon: 1
    chance: 1
  - common: 1
    uncommon: 2
    chance: 1
  - uncommon: 3
    chance: 1
  rare_mythic: 1
sheets:
  common:
    duplicates: true
    any:
    - query: "r:c"
      count: 39
      rate: 1
    - query: "r:c -id:c"
      count: 29
      rate: 3
  uncommon:
    duplicates: true
    any:
    - query: "r:u"
      count: 29
      rate: 1
    - query: "r:u -id:c"
      count: 24
      rate: 3
  rare_mythic:
    any:
    - query: "r:r"
      count: 21
      rate: 2
    - query: "r:r -id:c"
      count: 17
      rate: 6
    - query: "r:m"
      count: 5
      rate: 1
    - query: "r:m -id:c"
      count: 4
      rate: 3
