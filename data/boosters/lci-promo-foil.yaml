# https://media.wizards.com/2023/downloads/promo_packs/LCI_Promo_Pack_11062023.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    use: lci-promo.seasonal
    foil: true
  curated:
    use: lci-promo.curated
    foil: true
  dark_frame:
    use: lci-promo.dark_frame
    foil: true
