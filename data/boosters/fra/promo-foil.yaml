# https://magic.wizards.com/en/products/card-set-archive
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    use: fra-promo.seasonal
    foil: true
  curated:
    use: fra-promo.curated
    foil: true
  dark_frame:
    use: fra-promo.dark_frame
    foil: true
