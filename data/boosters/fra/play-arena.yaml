# Reality Fracture Arena Play Booster
#
# Arena keeps the 14-card layout and the linked Echoed pairs. It has no foils
# or Booster Fun treatments: their chance is folded into each card's regular
# printing, and the paper foil slot becomes a second nonfoil slot.
# Verified against 17lands public FRA PremierDraft data: 5,000 P1P1 packs, all
# 14 cards. Its 93 Special Guest cards match the paper sheet's 1-in-55 rate.
#
# Sources:
# - https://magic.wizards.com/en/news/feature/collecting-reality-fracture
# - https://scryfall.com/sets/fra
# - https://scryfall.com/sets/spg
#

filter: "e:{set}"
superfilter: "-variant:misprint"

pack:
  common_special_guest:
  - common: 6
    chance: 54
  - common: 5
    special_guest: 1
    chance: 1
  uncommon: 1
  common_uncommon: 1
  echoed_pairs:
  # -- Mythic pairs --
  - pair_ajani: 2
    third_not_ajani: 1
    chance: 1
  - pair_chandra: 2
    third_not_chandra: 1
    chance: 1
