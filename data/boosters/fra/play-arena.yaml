queries:
  regular: "e:{set} number:1-194"
  dual_land: "e:{set} number:175,177,178,182,183,184,190,192,193,194"
  basic_land: "e:{set} number:281-290"
  tower_land: "e:{set} number:382-396"
  echoed_regular: "e:{set} number:195-280"

sheets:
  common:
    query: "{regular} r:c -{dual_land}"
    count: 71

  uncommon:
    query: "{regular} r:u"
    count: 43

  rare:
    query: "{regular} r:r"
    count: 50

  mythic:
    query: "{regular} r:m"
    count: 20

  # Used by the replacement slot and by the third card of an Echoed pair.
  echoed_uncommon:
    query: "{echoed_regular} r:u"

  echoed_rare:
    query: "{echoed_regular} r:r"

  echoed_mythic:
    query: "{echoed_regular} r:m"

  # Template for the third echoed card: 5:2:1 per card by rarity. Each pair's own sheet narrows this with
  # A filter removes both cards in the fixed pair by exact name.
  echoed_third:
    count: 86 # 66 uncommon, 14 rare, and 6 mythic cards
    any:
    - use: echoed_uncommon
      chance: 66 * 5
    - use: echoed_rare
      chance: 14 * 2
    - use: echoed_mythic
      chance: 6 * 1

  common_uncommon:
    any:
    - use: common
      chance: 23
    - use: uncommon
      chance: 77

  rare_mythic:
    any:
    - use: rare
      chance: 50 * 2
    - use: mythic
      chance: 20 * 1

  foil_replacement:
    foil: false
    any:
    - use: common
      chance: 71 * 40
    - use: uncommon
      chance: 43 * 22
    - use: echoed_uncommon
      chance: 66 * 22
      count: 66
    - use: rare
      chance: 50 * 6
    - use: echoed_rare
      chance: 14 * 6
      count: 14
    - use: mythic
      chance: 20 * 3
    - use: echoed_mythic
      chance: 6 * 3
      count: 6

  land:
    any:
    - query: "{basic_land}"
      rate: 1
      count: 10
    - query: "{tower_land}"
      rate: 1
      count: 15
    - query: "{dual_land}"
      rate: 3
      count: 10

  special_guest:
    set: spg
    code: "FRA"
    count: 10

