# Include Assassin's Trophy (152s), whose story watermark is not Golgari.
# Exact eight-promo guild collation and odds remain unverified; retain the existing pool.
# Guilds of Ravnica -- seeded prerelease Guild Booster (Golgari).
# Guilds of Ravnica prerelease kits were seeded by guild: a ~15-card guild-colored pile
# (11 common + 3 uncommon) plus the folded, guild-colored foil year-stamped promo
# (using the repository 2:1 per-card rare/mythic convention). Seeded via the wedge/guild idiom -- cards in the guild's colors carrying
# the guild watermark or no watermark, excluding generic colorless. Matches the RTR/GTC model.
name: "{set_name} Seeded Prerelease Booster Golgari"
filter: "e:{set} id<=bg is:baseset (w:golgari or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 31
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn r:m (w:golgari or (id<=bg and -w:*)) promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn r:r (w:golgari or (id<=bg and -w:*) or number:152s) promo:prerelease"
      count: 10
      rate: 2
