# https://magic.wizards.com/en/products/card-set-archive
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
name: '{set_name} Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pfra promo:promopack r>=r
    use: rare_mythic
    foil: false
  curated:
    count: 121
    any:
    - rawquery: e:pbig number:1p,3p,4p,5p,8p,10p,12p,13p,15p,16p,17p,21p,22p,23p,25p,28p
      count: 16
      rate: 1
    - rawquery: e:pblb number:75p,100p,124p
      count: 3
      rate: 1
    - rawquery: e:pdft number:57p,77p,87p,115p,116p,118p,127p,158p,173p,191p,231p,237p
      count: 12
      rate: 1
    - rawquery: e:pdsk number:51p,113p,153p
      count: 3
      rate: 1
    - rawquery: e:pecl number:9p,27p,43p,46p,52p,54p,91p,95p,110p,130p,156p,170p,171p,195p
      count: 14
      rate: 1
    - rawquery: e:peoe number:2p,19p,35p,78p,79p,168p,183p,192p,196p,210p,253p,260p
      count: 12
      rate: 1
    - rawquery: e:pfdn number:97p,107p,132p
      count: 3
      rate: 1
    - rawquery: e:pfra number:1p,5p,20p,38p,43p,49pa,53p,59p,78p,93p,106p,110p,116p,121p,122p,128p,137p,140p,159p,168p,169p,176p,195p,212p,216p,229p,242p,244p,259p,276p
      count: 30
      rate: 1
    - rawquery: e:psos number:172p,180p,182p,184p,188p,194p,201p,202p,205p,212p,218p,226p,231p,239p,241p,245p
      count: 16
      rate: 1
    - rawquery: e:ptdm number:1p,33p,86p,105p,144p,187p,192p,228p,235p,246p,253p,260p
      count: 12
      rate: 1
    foil: false
  dark_frame:
    rawquery: e:fra promo:promopack
    count: 5
    foil: false
