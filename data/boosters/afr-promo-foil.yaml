# https://media.wizards.com/2021/downloads/promo_packs/AFR_Promo_Pack_07122021.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pafr promo:promopack r>=r -number:28p,23p,60p,126p,121p,155p,190p,4p,53p,91p,143p,207p
    use: rare_mythic
    foil: true
  curated:
    use: afr-promo.curated
    foil: true
  dark_frame:
    rawquery: e:afr promo:promopack
    count: 5
    foil: true
