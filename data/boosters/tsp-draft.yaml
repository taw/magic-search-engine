# Languages, per the WotC Card Set Archive product information for this set:
# https://web.archive.org/web/2014/http://magic.wizards.com/en/game-info/products/card-set-archive/time-spiral
# "Languages: English, French, Italian, Japanese, Portuguese (Brazil), Russian, Chinese Simplified, Spanish, German"
languages: cs, de, en, fr, it, jp, pt, ru, sp

pack:
  common_or_foil:
  - common: 1
    chance: 31
  - foil: 1
    chance: 9
  common: 9
  uncommon: 3
  rare: 1
  tsts: 1
sheets:
  # Can't find any information.
  # So just making up something: basic foils are in packs (even though basics aren't),
  # and tsts replaces 1/4 of foil commons
  foil:
    foil: true
    any:
    - query: "r:r"
      count: 80
      chance: 1
    - query: "r:u"
      count: 80
      chance: 2
    - query: "r<=c"
      count: 141
      chance: 4
    - rawquery: "e:tsb"
      count: 121
      chance: 1
  tsts:
    rawquery: "e:tsb"
    count: 121
