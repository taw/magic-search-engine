# Eight guild-specific promos (seven rares and one mythic):
# https://www.mtgsalvation.com/forums/magic-fundamentals/the-rumor-mill/228617-compiled-upcoming-promo-information
# Keep the existing 2:1 per-card rare/mythic weighting; historical odds are unverified.
# Common/uncommon pools and seeded collation remain approximate and unchanged.
name: "{set_name} Seeded Prerelease Booster Boros"
filter: "e:{set} id<=rw is:baseset (w:boros or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 32
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn number:153s promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn (number:204s or number:229sa or number:19s or number:109s or number:203s or number:165s or number:4s) promo:prerelease"
      count: 7
      rate: 2
