queries:
  regular: "e:{set} number:1-194"
  dual_land: "e:{set} number:175,177,178,182,183,184,190,192,193,194"
  basic_land: "e:{set} number:281-290"
  tower_land: "e:{set} number:382-396"
  echoed_regular: "e:{set} number:195-280"
  echoed_borderless: "e:{set} number:291-320"
  # Shattered mirror, sculptor's stronghold, braintwister, portal view lands (the only uncommons in
  # this range are the 5 braintwisters)
  boosterfun: "e:{set} number:321-381,397-401"
  # The same minus shattered mirror, which has no traditional foil printing
  foil_boosterfun: "e:{set} number:334-381,397-401"

sheets:
  common:
    query: "{regular} r:c -{dual_land}"
    count: 71

  # T = 3, braintwister w = 1
  uncommon:
    any:
    - query: "{boosterfun} r:u"
      rate: 1
      count: 5
    - query: "{regular} r:u alt:({boosterfun})"
      rate: 2
      count: 5
    - query: "{regular} r:u -alt:({boosterfun})"
      rate: 3
      count: 38

  # T = 8, treatment w = 1
  rare:
    any:
    - query: "{boosterfun} r:r"
      rate: 1
      count: 43
    - query: "{regular} r:r alt:({boosterfun})"
      rate: 7
      count: 43
    - query: "{regular} r:r -alt:({boosterfun})"
      rate: 8
      count: 7

  mythic:
    any:
    - query: "{boosterfun} r:m"
      rate: 1
      count: 18
    - query: "{regular} r:m alt:({boosterfun})"
      rate: 7
      count: 18
    - query: "{regular} r:m -alt:({boosterfun})"
      rate: 8
      count: 2

  # Same fold for the foil slot, but the 5 + 8 shattered mirror cards have a single foil printing and keep
  # the full weight 8 on it.
  foil_rare:
    any:
    - query: "{foil_boosterfun} r:r"
      rate: 1
      count: 38
    - query: "{regular} r:r alt:({foil_boosterfun})"
      rate: 7
      count: 38
    - query: "{regular} r:r -alt:({foil_boosterfun})"
      rate: 8
      count: 12

  foil_mythic:
    any:
    - query: "{foil_boosterfun} r:m"
      rate: 1
      count: 10
    - query: "{regular} r:m alt:({foil_boosterfun})"
      rate: 7
      count: 10
    - query: "{regular} r:m -alt:({foil_boosterfun})"
      rate: 8
      count: 10

  # Echoed cards by rarity, with the per-card 7:1 borderless fold (T = 8). Used by the foil slot and,
  # through echoed_third, by the third card of the echoed pairs slot. Counts are asserted by the users
  # (each per-pair sheet is 2 or 4 printings short), not here.
  echoed_uncommon:
    any:
    - query: "{echoed_borderless} r:u" # 10 cards
      rate: 1
    - query: "{echoed_regular} r:u alt:({echoed_borderless})" # 10 cards
      rate: 7
    - query: "{echoed_regular} r:u -alt:({echoed_borderless})" # 56 cards
      rate: 8

  echoed_rare:
    any:
    - query: "{echoed_borderless} r:r" # 14 cards
      rate: 1
    - query: "{echoed_regular} r:r" # 14 cards
      rate: 7

  echoed_mythic:
    any:
    - query: "{echoed_borderless} r:m" # 6 cards
      rate: 1
    - query: "{echoed_regular} r:m" # 6 cards
      rate: 7

  # Template for the third echoed card: 5:2:1 per card by rarity. Each pair's own sheet narrows this with
  # a filter that removes both halves by exact name (which also removes their borderless printings).
  echoed_third:
    count: 116 # 76 + 28 + 12 printings; each per-pair sheet below is short by its own pair's printings
    any:
    - use: echoed_uncommon
      chance: 66 * 5
    - use: echoed_rare
      chance: 14 * 2
    - use: echoed_mythic
      chance: 6 * 1

  common_uncommon:
    any:
    - use: common
      chance: 23
    - use: uncommon
      chance: 77

  rare_mythic:
    any:
    - use: rare
      chance: 50 * 2
    - use: mythic
      chance: 20 * 1

  foil:
    foil: true
    any:
    - use: common
      chance: 71 * 40
    - use: uncommon
      chance: 43 * 22
    - use: echoed_uncommon
      chance: 66 * 22
      count: 76
    - use: foil_rare
      chance: 50 * 6
    - use: echoed_rare
      chance: 14 * 6
      count: 28
    - use: foil_mythic
      chance: 20 * 3
    - use: echoed_mythic
      chance: 6 * 3
      count: 12

  # 10 basics : 15 tower basics : 10 common duals at triple weight = 18.2% / 27.3% / 54.5%
  non_foil_land:
    any:
    - query: "{basic_land}"
      rate: 1
      count: 10
    - query: "{tower_land}"
      rate: 1
      count: 15
    - query: "{dual_land}"
      rate: 3
      count: 10

  foil_land:
    foil: true
    use: non_foil_land

  special_guest:
    set: spg
    code: "FRA"
    count: 10

