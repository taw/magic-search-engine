# https://media.wizards.com/2024/downloads/promo_packs/MKM_Promo_Pack_02092024.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pmkm promo:promopack r>=r -number:4p,12p,47p,61p,94p,110p,123p,132p,172p,181p,184p,185p,186p,200p,211p,215p,224p,238p,240p,241p,259p,260p,262p,263p,264p,266p,268p,269p,270p,271p
    use: rare_mythic
    foil: true
  curated:
    use: mkm-promo.curated
    foil: true
  dark_frame:
    rawquery: e:mkm promo:promopack
    count: 5
    foil: true
