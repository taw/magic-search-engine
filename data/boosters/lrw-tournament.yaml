# Data from https://lethe.xyz/mtg/collation/lrw.html
# "Tournament packs have 3 rares, 10 uncommons, 32 commons, and 30 basic lands in
# addition to a rules insert, and a pro tour player card."
#
# A foil replaces one of the commons, whatever the foil's own rarity is:
# "if there is a foil, it will appear [in] the basic lands, displacing a common".
# Confirmed directly by this opening https://www.youtube.com/watch?v=PREjAzyDiQk,
# which has 3 normal rares AND a foil rare. That is the diagnostic case -- a foil
# common cannot distinguish the two rules, but a foil rare can, and same-rarity
# displacement would have left only 2 normal rares. lethe describes the same
# behaviour in Lorwyn boosters, where "uncommon and rare foils can displace either
# C or D cards" (C and D being common runs), and lrw-draft.yaml already models it
# that way: 11 commons drop to 10 while the uncommons and rare stay put.
#
# Foil count is weighted from the advertised odds, 1 : 51 cards for tournament
# packs (boosters are 1 : 56). Over 75 cards that is a binomial giving roughly
# 23% / 34% / 25% for 0 / 1 / 2 foils, with the remaining mass folded into 3.
# That reproduces what lethe saw -- foil-less packs with 32 commons, single-foil
# packs with 31 -- and in Shadowmoor a pack with 30 commons, i.e. two foils.
# Truncating at 3 pulls the mean down slightly, to about 1.39 foils per pack
# against the 1.47 the advertised rate implies; the alternative was inventing a
# tail lethe has never observed.
name: "{set_name} Tournament Deck"
pack:
  basic_with_duplicates: 30
  commons_and_foils:
  - common_with_duplicates: 32
    chance: 226
  - common_with_duplicates: 31
    foil: 1
    chance: 340
  - common_with_duplicates: 30
    foil: 2
    chance: 251
  - common_with_duplicates: 29
    foil: 3
    chance: 183
  uncommon_with_duplicates: 10
  rare: 3
sheets:
  basic_with_duplicates:
    duplicates: true
    use: basic
  common_with_duplicates:
    duplicates: true
    query: "r:c"
    count: 121
  uncommon_with_duplicates:
    duplicates: true
    use: uncommon
