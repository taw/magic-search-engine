# data from https://magic.wizards.com/en/news/feature/collecting-modern-horizons-3
# community review (https://github.com/taw/magic-search-engine/issues/442):
# no fetchlands, no ripple foils, no rare/mythic retro foils
pack:
- foil_retro: 1
  rm:
  - showcase_rm: 1
    chance: 2
  - foil_showcase_rm: 1
    chance: 1
queries:
  # The showcase treatments a rare/mythic can appear in, by collector number:
  # 320-361 borderless, 362-380 borderless profile, 381-383 concept Eldrazi,
  # 442-446a flip walkers, 447-467 textured. The sample has no retro-frame
  # (e:{set} number:384-441) rares/mythics, so the retro treatment is deliberately
  # not among them. A card shows up once per treatment it was printed in, and the
  # slots below split by how many of them it got, so each is weighted right; a
  # foil-only printing can't come out of these slots, so it isn't one of them.
  versions: "e:{set} number:320-383,442-467 -is:foilonly"
sheets:
  foil_retro:
    foil: true
    any:
    - rawquery: "e:{set} r:u number:384-441"
      count: 16
      rate: 4
    - rawquery: "e:{set} r:c number:384-441"
      count: 7
      rate: 8
    - rawquery: "e:h2r r:u"
      count: 6
      rate: 4
    - rawquery: "e:h2r r:c"
      count: 2
      rate: 8
  showcase_rm:
    # community review (https://github.com/taw/magic-search-engine/issues/442): the
    # sample has no retro-frame rares/mythics, so like foil_showcase_rm this drops the
    # retro treatment (e:mh3 number:384-441) and the retro-frame h2r timeshifts. The
    # m3c cards stay (these are nonfoil; only their foils would be ripple foils).
    any:
    - # mythic in two non-retro showcase treatments
      rawquery: "{versions} r:m prints>=2:{versions}"
      count: 2
      rate: 3
    - # mythic in one non-retro showcase treatment
      rawquery: "{versions} r:m prints=1:{versions}"
      count: 20
      rate: 6
    - # rare in one non-retro showcase treatment
      # (without the retro version no rare has two versions left, except the
      # fetchlands, which aren't in this product)
      rawquery: "{versions} r:r prints=1:{versions}"
      count: 58
      rate: 12
    - rawquery: "e:m3c number:9-16"
      rate: 6
      count: 8
      # nonfoil borderless mythic 6.1% 8
    - rawquery: "e:m3c number:25-31"
      rate: 6
      count: 7
      # nonfoil extended mythic 5.3% 7
    - rawquery: "e:m3c r:r (frame:extendedart or number<152 deck:\"eldrazi incursion\")"
      rate: 12
      count: 52
  foil_showcase_rm:
    # like showcase_rm (no retro-frame cards), but also without the m3c rares, whose
    # foils would be ripple foils; only the m3c mythic showcases remain in foil
    foil: true
    any:
    - # mythic in two non-retro showcase treatments
      rawquery: "{versions} r:m prints>=2:{versions}"
      count: 2
      rate: 3
    - # mythic in one non-retro showcase treatment
      rawquery: "{versions} r:m prints=1:{versions}"
      count: 20
      rate: 6
    - # rare in one non-retro showcase treatment
      # (without the retro version no rare has two versions left, except the
      # fetchlands, which aren't in this product)
      rawquery: "{versions} r:r prints=1:{versions}"
      count: 58
      rate: 12
    - rawquery: "e:m3c number:9-16"
      rate: 6
      count: 8
      # foil borderless mythic
    - rawquery: "e:m3c number:25-31"
      rate: 6
      count: 7
      # foil extended mythic
