# https://media.wizards.com/2024/downloads/promo_packs/OTJ_Promo_Pack_04162024.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:potj promo:promopack r:r
    use: rare_mythic
    foil: true
  curated:
    use: otj-promo.curated
    foil: true
  dark_frame:
    rawquery: e:otj promo:promopack
    count: 5
    foil: true
