# data from https://magic.wizards.com/en/news/feature/collecting-commander-legends-2020-10-26
pack:
  foil_common: 5
  # Preserve the previous 4:2:1 per-card rarity convention, conditioned
  # on the five published combinations (never two mythics).
  foil_legends:
  - foil_legend_uncommon: 2
    chance: 25600
  - foil_legend_uncommon: 1
    foil_legend_rare: 1
    chance: 16000
  - foil_legend_rare: 2
    chance: 2500
  - foil_legend_uncommon: 1
    foil_legend_mythic: 1
    chance: 1600
  - foil_legend_rare: 1
    foil_legend_mythic: 1
    chance: 500
  foil_rare_mythic_nonlegendary: 1
  extended_art_common_uncommon: 1
  extended_art_rare_mythic: 1
  foil_uncommon_extendedart: 2
  etched_uncommon: 1
  etched_reprint: 1
  etched_rare_mythic: 1
sheets:
  foil_common:
    foil: true
    query: "r:c or r:s"
    count: 142
  foil_legend_uncommon:
    foil: true
    query: "t:legendary r:u"
    count: 40
  foil_legend_rare:
    foil: true
    query: "t:legendary r:r"
    count: 25
  foil_legend_mythic:
    foil: true
    query: "t:legendary r:m"
    count: 5
  foil_rare_mythic_nonlegendary:
    foil: true
    any:
    - filter: "e:{set} -t:legendary is:baseset"
      use: rare_mythic
      count: 69
      chance: 7
    - filter: "e:{set} -t:legendary frame:extendedart"
      use: rare_mythic
      count: 69
      chance: 3
  extended_art_common_uncommon:
    filter: "e:{set} -t:legendary frame:extendedart"
    # The collecting guide specifies equal per-card C/U weights.
    rawquery: "e:{set} -t:legendary frame:extendedart r<=u"
    count: 33
  extended_art_rare_mythic:
    filter: "e:{set} -t:legendary frame:extendedart"
    use: rare_mythic
    count: 69
  foil_uncommon_extendedart:
    foil: true
    any:
    - query: "r:u -t:legendary"
      count: 80
      chance: 8
    - filter: "e:{set} -t:legendary frame:extendedart"
      rawquery: "e:{set} -t:legendary frame:extendedart r<=u"
      count: 33
      chance: 2
  etched_uncommon:
    foil: true
    etched: true
    rawquery: "e:{set} is:etched (r:u or r:s) -is:reprint"
    count: 41
  etched_reprint:
    foil: true
    etched: true
    filter: "e:{set} is:etched is:reprint"
    use: rare_mythic
    count: 32
  etched_rare_mythic:
    # Planeswalkers have traditional foil, not etched foil.
    any:
    - etched: true
      filter: "e:{set} is:etched -is:reprint"
      use: rare_mythic
      count: 28
      chance: 53
    - foil: true
      rawquery: "e:{set} t:planeswalker is:borderless"
      count: 2
      chance: 2
