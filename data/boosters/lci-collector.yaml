# Data from https://magic.wizards.com/en/news/feature/collecting-the-lost-caverns-of-ixalan
pack:
  foil_fullart_land: 1
  foil_common: 4
  foil_uncommon: 3
  foil_uncommon_showcase_or_borderless: 1
  foil_rare_mythic: 1
  extended_main_rare_mythic: 1
  commander_extended:
  - extended_commander_rare_mythic: 1
    chance: 7
  - foil_extended_commander_rare_mythic: 1
    chance: 1
  showcase_rare_mythic: 1
  jurrasic_world_slot:
  - jurrasic_world: 1
    chance: 799
  - foil_jurrasic_world: 1
    chance: 196
  - emblem_jurrasic_world: 1
    chance: 5
  finale:
  - foil_showcase_rare_mythic: 1
    chance: 993
  - neon_ink: 1
    chance: 7
sheets:
  foil_fullart_land:
    query: "t:basic is:fullart"
    foil: true
  foil_rare_mythic:
    foil: true
    use: rare_mythic
  extended_main_rare_mythic:
    # The Buy-a-Box promo (Jadelight Spelunker, lci #403) shares the extended-art
    # frame but is a WPN store promo, not a Collector Booster card - exclude it,
    # as every other set does (cf. dmu/khm/mom/mat collector sheets).
    filter: "e:lci frame:extendedart -promo:buyabox"
    use: rare_mythic
  extended_commander_rare_mythic:
    filter: "e:lcc frame:extendedart"
    use: rare_mythic
  foil_uncommon_showcase_or_borderless:
    foil: true
    any:
    - rawquery: "e:{set} is:showcase t:legendary r:u"
      count: 8
      rate: 55
    - rawquery: "e:{set} is:borderless t:dinosaur r:u"
      count: 6
      rate: 41
    - rawquery: "e:spg sheet:LCI r:u"
      count: 5
      rate: 3
  foil_extended_commander_rare_mythic:
    foil: true
    # The traditional-foil version of this slot is not just the extended-art
    # commanders: the article says it also includes "the new Commander content
    # found in Set Boosters" - i.e. the regular #1-16 and showcase #17-20
    # commander cards - in foil. Without number:1-20 their foils are productless.
    filter: "e:lcc (number:1-20 or frame:extendedart)"
    use: rare_mythic
  showcase_rare_mythic:
    any:
    - rawquery: "e:lcc promo:boosterfun -frame:extendedart -promo:neonink r:r"
      rate: 4
    - rawquery: 'e:lcc promo:boosterfun -frame:extendedart -promo:neonink r:m -name:"Quintorius Kand"'
      rate: 2
    - rawquery: 'e:lcc promo:boosterfun -frame:extendedart -promo:neonink r:m name:"Quintorius Kand"'
      rate: 1
  jurrasic_world:
    any:
    - rawquery: "e:rex -t:basic -promo:embossed -is:reversibleback"
      rate: 1
    - rawquery: "e:rex t:basic -promo:embossed -is:reversibleback"
      rate: 4
  foil_jurrasic_world:
    foil: true
    any:
    - rawquery: "e:rex -t:basic -promo:embossed -is:reversibleback"
      rate: 1
    - rawquery: "e:rex t:basic -promo:embossed -is:reversibleback"
      rate: 4
  emblem_jurrasic_world:
    foil: true
    rawquery: "e:rex promo:embossed"
  foil_showcase_rare_mythic:
    foil: true
    any:
    - rawquery: "e:lci promo:boosterfun r:r"
      rate: 4
    - rawquery: 'e:lci promo:boosterfun r:m -promo:neonink -name:"Quintorius Kand"'
      rate: 2
    - rawquery: 'e:lci promo:boosterfun r:m -promo:neonink name:"Quintorius Kand"'
      rate: 1
    - set: spg
      code: "LCICOLR"
      rate: 4
    - set: spg
      code: "LCICOLM"
      rate: 2
  neon_ink:
    foil: true
    any:
    - set: spg
      code: "LCINEON"
      chance: 1
    - any:
      - rawquery: "e:lci number:410a"
        rate: 1
      - rawquery: "e:lci number:410e"
        rate: 2
      - rawquery: "e:lci number:410d"
        rate: 4
      - rawquery: "e:lci number:410c"
        rate: 8
      - rawquery: "e:lci number:410f"
        rate: 16
      chance: 1
