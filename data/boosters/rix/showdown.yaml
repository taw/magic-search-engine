# Source: https://www.magiclibrarities.net/1103-rarities-standard-showdown-promos-english-cards-index.html
# Rarity weights reuse the generic booster estimates, not measured Showdown odds.
name: '{set_name} Standard Showdown Booster'
filter: (e:kld or e:aer or e:akh or e:hou or e:xln or e:rix) is:baseset -is:dfc -is:meld
pack:
  rare_mythic: 2
  foil: 1
  showdown_land: 1
sheets:
  showdown_land:
    foil: true
    rawquery: e:pss2
    count: 5
