queries:
  regular: "e:{set} number:1-194"
  echoed_regular: "e:{set} number:195-280"
  echoed_borderless: "e:{set} number:291-320"
  tower_land: "e:{set} number:382-396"
  braintwister: "e:{set} number:359-381"
  frc_borderless: "e:frc number:1-2"
  frc_extended_art: "e:frc number:88-103"
  # Borderless echoed pairs, shattered mirror, sculptor's stronghold, portal view lands, extended art
  non_foil_boosterfun: "e:{set} number:291-358,397-401,423-431"
  # The same in traditional foil: shattered mirror has none (facet foil only), braintwister joins
  foil_boosterfun_fra: "e:{set} number:291-320,334-381,397-401,423-431"
  japan_showcase: "e:{set} number:403-412"
  japan_showcase_fracture: "e:{set} number:413-422"
  facet_foil: "e:{set} number:449-461"
  serialized: "e:{set} number:402-402" # a range, because the DFC front is numbered 402a in mtgjson
  # Shattered mirror, sculptor's stronghold, braintwister, portal view lands
  boosterfun: "e:{set} number:321-381,397-401"

sheets:
  foil_common:
    foil: true
    query: "{regular} r:c"
    count: 71 + 10

  foil_uncommon:
    foil: true
    any:
    - query: "{regular} r:u"
      rate: 1
      count: 43
    - query: "{boosterfun} r:u"
      rate: 1
      count: 5

  foil_tower_land:
    foil: true
    query: "{tower_land}"
    count: 15

  foil_rare_mythic:
    foil: true
    any:
    - query: "{regular} r:r"
      rate: 2
      count: 50
    - query: "{echoed_regular} r:r"
      rate: 2
      count: 14
    - query: "{regular} r:m"
      rate: 1
      count: 20
    - query: "{echoed_regular} r:m"
      rate: 1
      count: 6

  braintwister_frc:
    any:
    - query: "{braintwister} r:r"
      rate: 2
      count: 15
    - query: "{braintwister} r:m"
      rate: 1
      count: 3
    - rawquery: "{frc_borderless}"
      rate: 1
      count: 2
    - rawquery: "{frc_extended_art}"
      rate: 2
      count: 16

  non_foil_boosterfun:
    any:
    - query: "{non_foil_boosterfun} r:r"
      rate: 2
      count: 14 + 5 + 18 + 5 + 7
    - query: "{non_foil_boosterfun} r:m"
      rate: 1
      count: 6 + 8 + 7 + 2

  # FRA printings R 2 : M 1 (136 units = 83.1%, so 1 unit = 0.61%); then a Special Guest is 1 unit, a Japan
  # Showcase 1.5 and a fracture foil 1/6 -- all x6 below. The listed lines sum to 99.2%, leaving ~0.8% for
  # facet foil + serialized, handled by the chance wrapper: facet foil 1 in 125 (R 2 : M 1 per card, i.e.
  # 0.44% / 0.36%), serialized 1 in 13,500 (500 copies vs ~6,000 per facet-foil rare).
  foil_boosterfun_regular:
    any:
    - query: "{foil_boosterfun_fra} r:r"
      rate: 12
      count: 14 + 18 + 15 + 5 + 7
    - query: "{foil_boosterfun_fra} r:m"
      rate: 6
      count: 6 + 7 + 3 + 2
    - set: spg
      code: "FRA"
      rate: 6
      count: 10
    - query: "{japan_showcase}"
      rate: 9
      count: 10
    - query: "{japan_showcase_fracture}"
      rate: 1
      count: 10

  facet_foil_shattered_mirror:
    any:
    - query: "{facet_foil} r:r"
      rate: 2
      count: 5
    - query: "{facet_foil} r:m"
      rate: 1
      count: 8

  foil_boosterfun:
    foil: true
    any:
    - use: foil_boosterfun_regular
      chance: 13500 - 108 - 1
    - use: facet_foil_shattered_mirror
      chance: 108
    - query: "{serialized}"
      chance: 1
      count: 1

  # Template for the third echoed card: all 76 uncommon printings equiprobable. Each pair's own sheet narrows it
  # with a filter that removes both halves by exact name (which also removes their borderless printings), so the
  # per-pair counts are 74, or 72 for pairs with a borderless version.
  foil_echoed_uncommon:
    foil: true
    count: 76
    any:
    - query: "{echoed_regular} r:u"
      rate: 1
    - query: "{echoed_borderless} r:u"
      rate: 1

