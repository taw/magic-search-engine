# Data from https://magic.wizards.com/en/news/feature/collecting-murders-at-karlov-manor
#
# Arena drops the paper basic land slot, so packs are 13 cards, not 14. The foil slot
# survives as a second nonfoil slot. Verified against 17lands public MKM PremierDraft
# data (52436 packs, all 13 cards, picks 0-12, zero basics).
#
# Known issue: measured Arena packs have 7.625 commons and 3.834 uncommons per pack,
# while this file yields 8.058 / 3.396 - about 0.44 cards per pack shift from common to
# uncommon in the wildcard + ex-foil slots. Rare (1.239 vs 1.244), mythic (0.179 vs
# 0.177) and The List (0.124 vs 0.125) all match, and the 30/20 rate 2:1 split of the
# MKM_ARENA sheets is confirmed. The two flexible slots factor as two independent slots
# of roughly 62/30/9 and 13/54/33 percent common/uncommon/rare+mythic, but which is the
# ex-foil one is not recoverable from pack contents, so it is left unmodelled here.
# Arena also has no separate rare-land branch: all 70 rares, surveil lands included,
# appear at an equal per-card rate.
pack:
  list_slot:
  - common: 7
    chance: 7
  - common: 6
    the_list: 1
    chance: 1
  uncommon: 3
  rare_mythic: 1
  wildcard: 1
  foil_replacement: 1
sheets:
  common:
    query: "r:c"
    count: 81
  rare_mythic:
    any:
    - query: "r:r -t:land"
      count: 60
      chance: 120
    - use: mythic
      chance: 20
  wildcard:
    any:
    - chance: 1
      query: "r:r t:land"
      count: 10
    - chance: 5
      any:
      - chance: 700
        use: common
      - chance: 175
        use: uncommon
      - chance: 125
        use: rare_mythic
  # Paper's foil slot. Arena has no foils, so it stays as a second nonfoil slot.
  foil_replacement:
    foil: false
    any:
    - chance: 12
      use: common
    - chance: 5
      use: uncommon
    - chance: 3
      any:
      - use: rare
        chance: 140
      - use: mythic
        chance: 20
  the_list:
    any:
    - rawquery: "sheet:MKM_ARENA_CU"
      count: 30
      rate: 2
    - rawquery: "sheet:MKM_ARENA_RM"
      count: 20
      rate: 1
