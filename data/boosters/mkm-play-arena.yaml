# Data from https://magic.wizards.com/en/news/feature/collecting-murders-at-karlov-manor
#
# Arena drops the paper basic land slot, so packs are 13 cards, not 14. The foil slot
# survives as a second nonfoil slot. Verified against 17lands public MKM PremierDraft
# data (52436 packs, all 13 cards, picks 0-12, zero basics).
#
# The same data confirms the 6-7 common / 3 uncommon floors, the 1-in-8 The List rate,
# the 2:1 rate split of the MKM_ARENA sheets, and the rare and mythic rates.
#
# Known issue: the common/uncommon weights on the wildcard and foil_replacement sheets
# below are wrong, and so are the paper ones in mkm-play.yaml that they were copied
# from. Wizards never published that split for MKM - the article only says "any rarity"
# plus the 1-in-6 rare dual land - so 700:175:125 and 12:5:3 are inherited assumptions.
# Sets whose articles do publish it (dft, tdm, fin, eoe) give a wildcard of roughly
# 12.5% common / 62.5% uncommon and a foil slot of roughly 58% common / 32% uncommon,
# and 17lands measures MKM Arena's two slots at about 62/30/9 and 13/54/33 percent
# common/uncommon/rare+mythic, matching that shape. Measured packs therefore have 7.625
# commons and 3.834 uncommons where this file yields 8.058 / 3.396. Fixing it means
# fixing mkm-play.yaml too, so it is left for a separate PR.
pack:
  list_slot:
  - common: 7
    chance: 7
  - common: 6
    the_list: 1
    chance: 1
  uncommon: 3
  rare_mythic: 1
  wildcard: 1
  foil_replacement: 1
sheets:
  common:
    query: "r:c"
    count: 81
  rare_mythic:
    any:
    - query: "r:r -t:land"
      count: 60
      chance: 120
    - use: mythic
      chance: 20
  wildcard:
    any:
    - chance: 1
      query: "r:r t:land"
      count: 10
    - chance: 5
      any:
      - chance: 700
        use: common
      - chance: 175
        use: uncommon
      - chance: 125
        use: rare_mythic
  # Paper's foil slot. Arena has no foils, so it stays as a second nonfoil slot.
  foil_replacement:
    foil: false
    any:
    - chance: 12
      use: common
    - chance: 5
      use: uncommon
    - chance: 3
      any:
      - use: rare
        chance: 140
      - use: mythic
        chance: 20
  the_list:
    any:
    - rawquery: "sheet:MKM_ARENA_CU"
      count: 30
      rate: 2
    - rawquery: "sheet:MKM_ARENA_RM"
      count: 20
      rate: 1
