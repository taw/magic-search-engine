# Data from https://magic.wizards.com/en/news/feature/collecting-murders-at-karlov-manor
#
# Arena drops the paper basic land slot, so packs are 13 cards, not 14. The foil slot
# survives as a second nonfoil slot. Verified against 17lands public MKM PremierDraft
# data (52436 packs, all 13 cards, picks 0-12, zero basics).
#
# The same data confirms the 6-7 common / 3 uncommon floors, the 1-in-8 The List rate,
# the 2:1 rate split of the MKM_ARENA sheets, and the rare and mythic rates.
#
# Wizards never published the common/uncommon split for the wildcard or the traditional
# foil slot - the article only says "any rarity", plus the 1-in-6 rare dual land - so
# the weights below are fitted to that Arena data, as in mkm-play.yaml. Only the two
# slots combined are observable in a pack; the split between them follows the shape
# Wizards did publish for later sets (see eoe-play.yaml) and agrees with an independent
# two-slot factorisation of the same data.
pack:
  list_slot:
  - common: 7
    chance: 7
  - common: 6
    the_list: 1
    chance: 1
  uncommon: 3
  rare_mythic: 1
  wildcard: 1
  foil_replacement: 1
sheets:
  common:
    query: "r:c"
    count: 81
  rare_mythic:
    any:
    - query: "r:r -t:land"
      count: 60
      chance: 120
    - use: mythic
      chance: 20
  wildcard:
    any:
    - chance: 1
      query: "r:r t:land"
      count: 10
    - chance: 5
      any:
      - chance: 203
        use: common
      - chance: 616
        use: uncommon
      - chance: 181
        use: rare_mythic
  # Paper's foil slot. Arena has no foils, so it stays as a second nonfoil slot.
  foil_replacement:
    foil: false
    any:
    - chance: 580
      use: common
    - chance: 320
      use: uncommon
    - chance: 100
      any:
      - use: rare
        chance: 140
      - use: mythic
        chance: 20
  the_list:
    any:
    - rawquery: "sheet:MKM_ARENA_CU"
      count: 30
      rate: 2
    - rawquery: "sheet:MKM_ARENA_RM"
      count: 20
      rate: 1
