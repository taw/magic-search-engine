      count: 16
      rate: 1
    - rawquery: e:prix number:142p
      count: 1
      rate: 1
    - rawquery: e:prna number:29p,130p,157p
      count: 3
      rate: 1
    - rawquery: e:psoi number:242p
      count: 1
