# https://media.wizards.com/2020/downloads/promo_packs/ZNR_Promo_Pack_09252020.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pznr promo:promopack r>=r -is:dfc -is:meld
    use: rare_mythic
    foil: true
  curated:
    count: 121
    any:
    - rawquery: e:paer number:49p
      count: 1
      rate: 1
    - rawquery: e:pdom number:35p,215p
      count: 2
      rate: 1
    - rawquery: e:peld number:8p,18p,20p,39pa,43p,44pa,48p,51p,55p,71p,75p,79p,97pa,110p,115pa,120p,124p,125p,147p,160p,161p,165pa,171p,172p,181p,185p,186p,190p,235p,238p,239p,240p,241p,242p,244p
      count: 35
      rate: 1
    - rawquery: e:pgrn number:77p,211p
      count: 2
      rate: 1
    - rawquery: e:phou number:15p,165p
      count: 2
      rate: 1
    - rawquery: e:piko number:7p,24p,66p,84p,88p,97p,114p,127p,155p,162p,175p,189p,191p,197p,198p,204p,212p,215p,224p,226p,248p,250p,251p,253p,259p
      count: 25
