# https://media.wizards.com/2022/downloads/promo_packs/NEO_Promo_Pack_02092022.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pneo promo:promopack r>=r -is:dfc -is:meld -number:404p
    use: rare_mythic
    foil: true
  curated:
    use: neo-promo.curated
    foil: true
  dark_frame:
    rawquery: e:neo promo:promopack
    count: 5
    foil: true
