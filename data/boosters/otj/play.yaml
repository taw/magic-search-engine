# Data from https://magic.wizards.com/en/news/feature/collecting-outlaws-of-thunder-junction
pack:
  land_slot:
  - land: 1
    chance: 4
  - foil_land: 1
    chance: 1
  list_slot:
  - common: 6
    chance: 4
  - common: 5
    the_list: 1
    chance: 1
  uncommon: 3
  rare_mythic_with_showcase: 1
  breaking_news: 1
  wildcard: 1
  foil: 1
sheets:
  land:
    any:
    - query: "t:basic"
      count: 15
      chance: 1
    - query: "t:land number:251-264 r:c -(Mirage Mesa) -(Conduit Pylons)"
      count: 10
      chance: 1
  foil_land:
    foil: true
    use: land
  mythic_with_showcase:
    # Showcase treatments 1/3 for relevant cards
    any:
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper (Oko Ringleader)"
      count: 2
      rate: 1
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -(Oko Ringleader)"
      count: 8
      rate: 2
    - use: mythic_has_showcase
      rate: 4
    - use: mythic_has_no_showcase
      rate: 6
  rare_mythic_with_showcase:
    any:
    - use: rare_with_showcase
      chance: 6
    - use: mythic_with_showcase
      chance: 1
  # Only the rare/mythic rate of the wildcard slot is published (1 in 12); the
  # common/uncommon split of the wildcard and the whole traditional foil slot are not.
  # Those are fitted to 17lands Arena pack data (31054 OTJ packs). Only the two slots
  # combined are observable in a pack, so the wildcard keeps its published 1-in-12 and
  # the foil slot takes the remainder, which lands at ~9% rare/mythic - matching what
  # Wizards later published for eoe.
  wildcard:
    any:
    - chance: 654
      use: common
    - chance: 260
      use: uncommon
    - chance: 83 # wildcard is a rare/mythic in 1 of 12 Play Boosters
      use: rare_mythic_with_showcase
  foil:
    foil: true
    any:
    - chance: 587
      use: common
    - chance: 324
      use: uncommon
    - chance: 89
      use: rare_mythic_with_showcase
  the_list:
    # The List slot is 1/5 of packs and holds 30 Big Score + 10 Special
    # Guests cards, but a non-foil Special Guests appears in only 1/64 packs
    # (1.5625% overall = 7.8125% of this slot). Weight Big Score : SPG =
    # 118 : 10 (not per-card equal) -> Big Score ~18.4%, SPG 1/64.
    any:
    - rawquery: "e:big number<=30"
      count: 30
      chance: 118
    - set: spg
      code: "OTJ"
      chance: 10
  common:
    query: "r:c -(number:251-264 -(Mirage Mesa) -(Conduit Pylons))"
    count: 81
  breaking_news:
    # Article: in 1 of 3 Play Boosters the Breaking News card is a rare or
    # mythic. base_1248_by_rarity over this commonless pool gave ~48%; use an
    # explicit 2:1 uncommon : rare/mythic split.
    filter: "e:otp number<=65"
    any:
    - query: "r:u"
      count: 20
      chance: 2
    - query: "r:r or r:m"
      count: 45
      chance: 1
