# Data from https://magic.gg/news/streets-of-new-capenna-prerelease-primer
# Languages, per https://wpn.wizards.com/en/news/streets-of-new-capenna-preview-retail-guide:
# "Prerelease Packs ... Languages available: English, Chinese (Simplified), German, French, Italian, Spanish, Japanese, Portuguese, Russian"
languages: cs, de, en, fr, it, jp, pt, ru, sp

name: "{set_name} Seeded Prerelease Pack Obscura"
filter: "e:{set} id<=esper (w:Obscura or -w:*) is:baseset"
pack:
  intro_set: 2
  land: 1
  common: 8
  uncommon: 3
  rare_mythic: 1
  prerelease_promo: 1
sheets:
  intro_set:
    fixed: true
    query: "(t:land id:0) or (r:c c:3)"
    count: 2
  land:
    query: "t:land id:2"
    count: 2
  common:
    query: "r:c -t:land -(r:c c:3)"
    count: 42
  prerelease_promo:
    filter: "e:psnc promo:prerelease"
    use: rare_mythic
    foil: true
