# https://media.wizards.com/2023/downloads/promo_packs/MOM_Promo_Pack_04122023.pdf
# Seasonal rare/mythic weights use the 2:1 per-card convention where applicable.
# Other sheets use estimated equal per-card weights; exact collation is unpublished.
# The Arena code is not a gameplay card.
name: '{set_name} Foil Promo Pack'
pack:
  seasonal: 1
  curated: 1
  dark_frame: 1
sheets:
  seasonal:
    filter: e:pmom promo:promopack r>=r -is:dfc -is:meld -number:226p,249p,250p,263p,6p,28p,134p,217p,219p,245p,255p,257p,258p,265p
    use: rare_mythic
    foil: true
  curated:
    use: mom-promo.curated
    foil: true
  dark_frame:
    rawquery: e:mom promo:promopack
    count: 5
    foil: true
