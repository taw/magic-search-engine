# Data from https://magic.wizards.com/en/news/feature/collecting-march-of-the-machine-the-aftermath
pack:
  # Article: the foil showcase uncommon slot and the foil showcase
  # rare/mythic slot are EACH a Halo foil ~1 in 6, independently. The old
  # single halo_slot made the two Halo upgrades mutually exclusive, so each
  # appeared only 1 in 12. Split into two independent 5:1 slots.
  halo_uncommon_slot:
  - foil_showcase_uncommon: 1
    chance: 5
  - halo_showcase_uncommon: 1
    chance: 1
  halo_rare_mythic_slot:
  - foil_showcase_rare_mythic: 1
    chance: 5
  - halo_showcase_rare_mythic: 1
    chance: 1
  etched_uncommon: 1
  foil_rare_mythic: 1
  extended_slot:
  - extended_rare_mythic: 1
    chance: 2
  - foil_extended_rare_mythic: 1
    chance: 1
  etched_rare_mythic: 1
sheets:
  foil_showcase_uncommon:
    foil: true
    rawquery: "e:{set} r:u promo:boosterfun -frame:extendedart -is:foilonly"
    count: 15
  etched_uncommon:
    foil: true
    etched: true
    rawquery: "e:{set} r:u is:etched"
    count: 15
  foil_rare_mythic:
    foil: true
    use: rare_mythic
    count: 35
  extended_rare_mythic:
    filter: "e:{set} frame:extendedart -promo:buyabox"
    use: rare_mythic
    count: 35
  foil_extended_rare_mythic:
    foil: true
    use: extended_rare_mythic
    count: 35
  etched_rare_mythic:
    foil: true
    etched: true
    filter: "e:{set} is:etched"
    use: rare_mythic
    count: 35
  foil_showcase_rare_mythic:
    foil: true
    filter: "e:{set} promo:boosterfun -frame:extendedart -is:foilonly"
    use: rare_mythic
    count: 35
  halo_showcase_rare_mythic:
    foil: true
    filter: "e:{set} promo:halofoil"
    use: rare_mythic
    count: 29
  halo_showcase_uncommon:
    foil: true
    rawquery: "e:{set} promo:halofoil r:u"
    count: 14
