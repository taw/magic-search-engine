# Data from https://magic.wizards.com/en/news/feature/collecting-bloomburrow
pack:
  land_slot:
  - land: 1
    chance: 4
  - foil_land: 1
    chance: 1
  list_slot:
  - common: 7
    chance: 985
  - common: 6
    special_guest: 1
    chance: 15
  uncommon: 3
  rare_mythic_with_showcase: 1
  wildcard: 1
  foil: 1
sheets:
  common:
    query: "r:c"
    count: 81
  land:
    any:
    - query: "number:262,266,270,274,278"
      count: 5
      chance: 4
    - query: "number:263,267,271,275,279"
      count: 5
      chance: 3
    - query: "number:264,268,272,276,280"
      count: 5
      chance: 2
    - query: "number:265,269,273,277,281"
      count: 5
      chance: 1
  foil_land:
    foil: true
    use: land
  mythic_with_showcase:
    # Showcase treatments 1/3 for relevant cards
    any:
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper (Lumra)"
      count: 2
      rate: 1
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart is:paper -(Lumra)"
      count: 19
      rate: 2
    - use: mythic_has_showcase
      rate: 4
      count: 20
  rare_with_showcase:
    # Showcase treatments 1/3 for relevant cards
    any:
    - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper (Three Tree City)"
      count: 4
      rate: 1
    - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart is:paper -(Three Tree City)"
      count: 36
      rate: 4
    - use: rare_has_showcase
      rate: 8
      count: 37
    - use: rare_has_no_showcase
      rate: 12
      count: 23
  rare_mythic_with_showcase:
    any:
    - use: rare_with_showcase
      chance: 6
    - use: mythic_with_showcase
      chance: 1
  # Wizards published no rarity split for the wildcard or the traditional foil slot
  # ("1 Wildcard of any rarity", "1 Traditional foil of any rarity"), so these are
  # fitted to 17lands Arena pack data (37063 BLB packs). Only the two slots combined
  # are observable in a pack; the split between them follows the shape Wizards did
  # publish for later sets (see eoe-play.yaml: wildcard is uncommon-heavy, the foil
  # slot is common-heavy at roughly 58/32/10).
  wildcard:
    any:
    - chance: 200
      use: common
    - chance: 645
      use: uncommon
    - chance: 155
      use: rare_mythic_with_showcase
  foil:
    foil: true
    any:
    - chance: 580
      use: common
    - chance: 320
      use: uncommon
    - chance: 100
      use: rare_mythic_with_showcase
  special_guest:
    set: spg
    code: "BLB"
