# Data from https://magic.wizards.com/en/news/feature/whats-inside-the-brothers-war-boosters
# Serialized and foil Shattered Glass rates each assumed to be 0.5% (<1% published).
# Transformer totals: 21% foil and 12% Shattered Glass, including their overlap.
pack:
  foil_fullart_basic: 1
  foil_common: 4
  foil_uncommon: 2
  foil_rare_mythic: 1
  extended_rare_mythic: 1
  extended_commander_jumpstart: 1
  nonfoil_brr:
  - brr_retro_artifact_uncommon: 1
    brr_schematic_rare_mythic: 1
    chance: 1
  - brr_schematic_uncommon: 1
    brr_retro_artifact_rare_mythic: 1
    chance: 1
  foil_brr_retro_artifact_schematic_uncommon: 1
  transformers_slot:
  - transformers: 1
    chance: 675
  - shattered_glass: 1
    chance: 115
  - foil_transformers: 1
    chance: 205
  - foil_shattered_glass: 1
    chance: 5
  finale_slot:
  - foil_alt_art: 1
    chance: 995
  - double_rainbow_serialized: 1
    chance: 5
sheets:
  foil_fullart_basic:
    foil: true
    query: "r:b is:fullart"
    count: 10
  foil_rare_mythic:
    foil: true
    use: rare_mythic
  extended_rare_mythic:
    count: 80
    filter: "e:{set} (number:301-372 or is:borderless)"
    use: rare_mythic
  extended_commander_jumpstart:
    filter: "(e:{set} number:373-377) or (e:brc frame:extendedart)"
    use: rare_mythic
  brr_retro_artifact_uncommon:
    rawquery: "e:brr number<=63 r:u -number:/z/"
    count: 18
  brr_schematic_uncommon:
    rawquery: "e:brr number>=64 r:u -number:/z/"
    count: 18
  brr_retro_artifact_rare_mythic:
    filter: "e:brr number<=63 -number:/z/"
    use: rare_mythic
  brr_schematic_rare_mythic:
    filter: "e:brr number>=64 -number:/z/"
    use: rare_mythic
  foil_brr_retro_artifact_schematic_uncommon:
    foil: true
    any:
    - use: brr_retro_artifact_uncommon
      chance: 5
    - use: brr_schematic_uncommon
      chance: 1
  transformers:
    rawquery: "e:bot number<16"
    count: 15
  shattered_glass:
    rawquery: "e:bot number>=16"
    count: 14
  foil_shattered_glass:
    foil: true
    use: shattered_glass
  foil_transformers:
    foil: true
    use: transformers
  foil_alt_art:
    foil: true
    any:
    - rawquery: "((e:{set} -number:373-377) or e:brc) promo:boosterfun r:r"
      count: 64
      rate: 12
    - rawquery: "e:brr number<=63 r:r -number:/z/"
      count: 30
      rate: 10
    - rawquery: "e:brr number>=64 r:r -number:/z/"
      count: 30
      rate: 2
    - rawquery: "(e:{set} or e:brc) promo:boosterfun r:m"
      count: 27
      rate: 6
    - rawquery: "e:brr number<=63 r:m -number:/z/"
      count: 15
      rate: 5
    - rawquery: "e:brr number>=64 r:m -number:/z/"
      count: 15
      rate: 1
  double_rainbow_serialized:
    foil: true
    filter: "e:brr number:/z/"
    use: base_1248_by_rarity
