# Data from https://magic.wizards.com/en/news/feature/collecting-commander-masters
pack:
  foil_common: 4
  foil_uncommon: 2
  foil_basic: 1
  common_uncommon_showcase: 2
  foil_common_uncommon_showcase: 1
  foil_rare_mythic: 1
  rare_mythic_showcase: 1
  extended:
  - extended_commander: 1
    chance: 4
  - foil_extended_commander: 1
    chance: 1
  etched_rare_mythic: 1
  foiling:
  - foil_rare_mythic_showcase: 1
    chance: 96
  - textured_rare_mythic: 1
    chance: 4
sheets:
  extended_commander:
    filter: "e:cmm frame:extendedart"
    count: 35
    use: rare_mythic
  foil_extended_commander:
    foil: true
    filter: "e:cmm frame:extendedart"
    count: 35
    use: rare_mythic
  etched_rare_mythic:
    foil: true
    etched: true
    # is:etched also matches the 4 "thick" deck-box display commanders (779-782);
    # exclude them so only the 170 main-set Etched Foils (452-621) remain.
    filter: "e:cmm is:etched -is:thick"
    count: 170
    use: rare_mythic
  foil_rare_mythic:
    foil: true
    count: 170
    use: rare_mythic
  foil_rare_mythic_showcase:
    foil: true
    count: 52
    use: rare_mythic_showcase
  textured_rare_mythic:
    foil: true
    filter: "e:cmm promo:textured"
    count: 10
    use: rare_mythic
