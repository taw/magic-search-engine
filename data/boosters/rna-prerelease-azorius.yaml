# Ravnica Allegiance -- seeded prerelease Guild Booster (Azorius).
# Ravnica Allegiance prerelease kits were seeded by guild: a ~15-card guild-colored pile
# (11 common + 3 uncommon) plus the folded, guild-colored foil year-stamped promo
# (2:1 rare:mythic). Seeded via the wedge/guild idiom -- cards in the guild's colors carrying
# the guild watermark or no watermark, excluding generic colorless. Matches the RTR/GTC model.
name: "{set_name} Seeded Prerelease Booster Azorius"
filter: "e:{set} id<=wu is:baseset (w:azorius or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 33
  # https://magic.wizards.com/en/news/feature/ravnica-allegiance-prerelease-primer
  # Exact eight-card guild pools remain unverified; this preserves existing candidates.
  promo:
    foil: true
    # Emergency Powers is a story spotlight with a planeswalker watermark.
    # Preserve the existing rare pool pending evidence for exact guild assignments.
    # The 2:1 per-card weighting follows the other RNA guild definitions; unverified.
    any:
    - rawquery: "e:prna r:m id:wu promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:prna r:r (w:azorius or (id<=wu and -w:*)) promo:prerelease"
      count: 8
      rate: 2
