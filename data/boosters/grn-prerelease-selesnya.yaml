# Keep the existing 2:1 per-card rare/mythic weighting; historical odds are unverified.
# Common/uncommon pools and seeded collation remain approximate and unchanged.
name: "{set_name} Seeded Prerelease Booster Selesnya"
filter: "e:{set} id<=gw is:baseset (w:selesnya or -w:*) -(c:c -w:*)"
pack:
  common: 11
  uncommon: 3
  promo: 1
sheets:
  common:
    query: "r:c"
    count: 33
  promo:
    foil: true
    any:
    - rawquery: "e:pgrn number:208s promo:prerelease"
      count: 1
      rate: 1
    - rawquery: "e:pgrn (number:30s or number:8s or number:123s or number:124s or number:168s or number:221sa or number:183s) promo:prerelease"
      count: 7
      rate: 2
