# Data from youtube, e.g. https://www.youtube.com/watch?v=gnq3xpi0qWs&ab_channel=BadBoyGaming
# Languages, per https://wpn.wizards.com/en/news/streets-of-new-capenna-preview-retail-guide:
# "Theme Boosters ... Languages available: English, Chinese (Simplified), German, French, Italian, Spanish, Japanese, Portuguese, Russian"
languages: cs, de, en, fr, it, jp, pt, ru, sp

name: "{set_name} Theme Booster Obscura"
filter: "e:{set} id<=esper (is:baseset or promo:themepack) (w:Obscura or -w:*)"
pack:
  uncommon: 10
  common: 21
  variable:
  - common: 3
    chance: 1
  - common: 2
    uncommon: 1
    chance: 1
  - common: 1
    uncommon: 2
    chance: 1
  - uncommon: 3
    chance: 1
  rare_mythic: 1
sheets:
  common:
    duplicates: true
    any:
    - query: "r:c"
      count: 46
      rate: 1
    - query: "r:c -id:c"
      count: 39
      rate: 3
  uncommon:
    duplicates: true
    any:
    - query: "r:u"
      count: 35
      rate: 1
    - query: "r:u -id:c"
      count: 30
      rate: 3
  rare_mythic:
    any:
    - query: "r:r"
      count: 22
      rate: 2
    - query: "r:r -id:c"
      count: 20
      rate: 6
    - query: "r:m"
      count: 8
      rate: 1
    - query: "r:m -id:c"
      count: 7
      rate: 3
