# Data from https://magic.wizards.com/en/news/feature/almost-everything-know-about-unfinity-boosters-2022-09-20
# Nonfoil showcase treatments replace eligible cards one quarter of the time.
# shocklands can appear in draft boosters
filter: "e:{set} number:1-set,277-286 -number:/m/"
pack:
  basic_or_shock:
  - basic_alt: 1
    chance: 23
  - shock: 1
    chance: 1
  common_or_foil:
  - common: 7
    chance: 2
  - common: 6
    foil_with_showcase: 1
    chance: 1
  uncommon_with_showcase: 3
  rare_mythic_with_showcase: 1
  attraction: 2
  sunf_sticker: 1
sheets:
  basic_alt:
    any:
    - query: "r:b number<240"
      count: 5
      chance: 3
    - query: "r:b number:240-244"
      count: 5
      chance: 1
  shock:
    query: "number:277-286"
    count: 10
  common:
    query: "r:c -t:attraction is:paper"
    count: 80
  uncommon_with_showcase:
    any:
    - rawquery: "e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart -t:attraction is:paper"
      count: 10
      rate: 1
    - query: "r:u alt:(e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction"
      count: 10
      rate: 3
    - query: "r:u -alt:(e:{set} r:u promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction"
      count: 50
      rate: 4
  rare_mythic_with_showcase:
    any:
    - rawquery: "e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart -t:attraction -t:background is:paper -is:shockland"
      count: 14
      rate: 2
    - query: "r:r alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction -t:background -is:shockland"
      count: 14
      rate: 6
    - query: "r:r -alt:(e:{set} r:r promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction -t:background -is:shockland"
      count: 27
      rate: 8
    - rawquery: "e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart -t:attraction -t:background is:paper"
      count: 8
      rate: 1
    - query: "r:m alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction -t:background"
      count: 8
      rate: 3
    - query: "r:m -alt:(e:{set} r:m promo:boosterfun -is:foilonly -frame:extendedart) -t:attraction -t:background"
      count: 10
      rate: 4
  attraction:
    query: "t:attraction"
    count: 135
  sunf_sticker:
    rawquery: "e:sunf t:stickers"
    count: 48
