# Data from https://magic.wizards.com/en/news/feature/collecting-the-lord-of-the-rings-tales-of-middle-earth
pack:
  basicfoiling:
  - basic: 1
    chance: 4
  - foil_basic: 1
    chance: 1
  common: 3
  uncommon: 3
  common_uncommon_showcase: 1
  wildcard: 2
  rare_mythic: 1
  finale:
  - foil_with_showcase: 1
    chance: 3
  - foil_with_showcase: 1
    the_list: 1
    chance: 1
sheets:
  common:
    query: "r:c -number>451"
    count: 101
  uncommon:
    any:
    - query: 'r:u -name:"Nazgûl"'
      count: 79
      chance: 79
    - rawquery: 'e:{set} name:"Nazgûl" -number>451'
      count: 9
      chance: 1
  with_showcase:
    any:
    # Scene range is 405-447 only: the Bilbo's Birthday Party (399-404) and
    # Mount Doom (448-451) scenes are NOT in Set Boosters (per the card image
    # gallery), so their borderless scene cards are excluded here.
    - query: "promo:boosterfun alt:(e:{set} number:302-331,340-345) alt:(e:{set} number:405-447) -number:299-300 -number>451"
      rate: 1
    - query: "(number:302-331,340-345) -alt:(e:{set} number:405-447)"
      rate: 2
    - query: "-alt:(e:{set} number:302-331,340-345) number:405-447"
      rate: 2
    # No count: this sheet is used via `use:` with per-rarity filters
    # (common/uncommon/rare/mythic_with_showcase), so these queries resolve to a
    # different pool in each context and can't take a single static count.
    - query: "is:baseset alt:(e:{set} promo:boosterfun -is:foilonly -frame:extendedart)"
      rate: 4
    - query: "is:baseset -alt:(e:{set} promo:boosterfun -is:foilonly -frame:extendedart)"
      rate: 6
  common_with_showcase:
    filter: "e:{set} r:c -number>451"
    use: with_showcase
  rare_with_showcase:
    filter: "e:{set} r:r -number>451"
    use: with_showcase
  uncommon_with_showcase:
    filter: 'e:{set} r:u -name:"Nazgûl" -number>451'
    any:
    - use: with_showcase
      chance: 79
    - rawquery: 'e:{set} name:"Nazgûl" -number>451'
      count: 9
      chance: 1
  common_uncommon_showcase:
    any:
    - rawquery: "e:{set} r:c number:405-447"   # Borderless scene commons
      count: 8
      rate: 4
    - rawquery: "e:{set} r:u number:405-447"   # Borderless scene uncommons
      count: 9
      rate: 2
    - rawquery: "e:{set} r:u number:302-331"   # Showcase Ring uncommons
      count: 10
      rate: 2
  mythic_with_showcase:
    filter: "e:{set} r:m -number>451"
    use: with_showcase
  rare_mythic_with_showcase:
    any:
    - use: rare_with_showcase
      chance: 120
    - use: mythic_with_showcase
      chance: 20
    # Cards that appear in the Set Booster but aren't is:baseset, so the sheets
    # above miss them: the 5 Jumpstart rares (#282-286, also nonfoil from
    # Jumpstart) and the 8 mythic Commander legends (#1-8, also foil from the
    # decks). This sheet feeds both the wildcard (nonfoil) and the foil slot, so
    # it covers both finishes at once.
    - rawquery: "e:ltr number:282-286"
      count: 5
      chance: 10
    - rawquery: "e:ltc number:1-8"
      count: 8
      chance: 8
  wildcard:
    any:
    - use: common_with_showcase
      chance: 700
    - use: uncommon_with_showcase
      chance: 175
    - use: rare_mythic_with_showcase
      chance: 125
  foil_with_showcase:
    foil: true
    any:
    - filter: "e:{set} (r:c or r:b) -number>451"
      use: with_showcase
      chance: 12
    - use: uncommon_with_showcase
      chance: 5
    - use: rare_mythic_with_showcase
      chance: 3
  the_list:
    set: plst
    code: "LTR"
