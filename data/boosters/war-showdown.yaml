# Source: https://www.magiclibrarities.net/1103-rarities-standard-showdown-promos-english-cards-index.html
# Rarity weights reuse the generic booster estimates, not measured Showdown odds.
# The guaranteed land is from the PREVIOUS Ravnica Weekend (not this set's guilds).
name: '{set_name} Standard Showdown Booster'
filter: (e:xln or e:rix or e:dom or e:m19 or e:grn or e:rna or e:war) is:baseset -is:dfc -is:meld
pack:
  rare_mythic: 2
  foil: 1
  showdown_land: 1
sheets:
  showdown_land:
    foil: true
    rawquery: e:prw2
    count: 10
