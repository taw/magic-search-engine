# data from https://magic.wizards.com/en/news/feature/collecting-march-of-the-machine
# No info on what other cards are in rare_mythic slot. Assuming it's only core set non-showcase cards
# Etched foil rate reported as 4%, or 1/25 packs
pack:
  # Keep the usual 20% Set Booster foil-land convention; exact finish odds are unpublished.
  land_slot:
  - basic: 1
    chance: 4
  - foil_basic: 1
    chance: 1
  sfc_common: 2
  sfc_uncommon: 2
  dfc_common_uncommon: 1
  uncommon_battle: 1
  wildcard: 2
  multiverse_legend: 1
  finale_1:
  - rare_mythic: 1
    chance: 3
  - rare_mythic: 1
    the_list: 1
    chance: 1
  finale_2:
  - mom_foil_with_showcase: 1
    chance: 24
  - foil_etched: 1
    chance: 1
sheets:
  basic:
    any:
    - query: "t:basic -is:fullart"
      count: 5
      chance: 2
    - query: "t:basic is:fullart"
      count: 10
      chance: 1
  foil_basic:
    foil: true
    use: basic
  sfc_common:
    query: "r:c is:sfc"
    count: 111
  dfc_common_uncommon:
    any:
    - use: dfc_common
      count: 5
      rate: 2
    - query: "r:u is:dfc -t:battle"
      count: 10
      rate: 1
  uncommon_battle:
    query: "r:u t:battle"
    count: 20
  multiverse_legend:
    # Article: ~one third of non-foil Multiverse Legends are rare/mythic.
    # base_1248_by_rarity over the 20u/30r/15m pool gave ~48%; use a 2:1
    # uncommon : rare/mythic split instead.
    filter: "e:mul -is:foilonly is:paper"
    count: 65
    any:
    - query: "r:u"
      count: 20
      chance: 2
    - query: "r:r or r:m"
      count: 45
      chance: 1
  wildcard:
    any:
    - use: common
      chance: 700
      count: 116
    - any:
      - use: uncommon
        chance: 80
        count: 80
      - rawquery: "e:mul r:u -is:foilonly is:paper"
        chance: 20
        count: 20
      chance: 175
    - any:
      - use: rare_with_showcase
        count: 78
        chance: 2 * 60
      - rawquery: "e:mom r:r number:323-337 is:paper"
        chance: 2 * 5
        count: 5
      # #72-79 (Planeswalker's Talents cycle etc.) only appear in Set and
      # Collector Boosters, not the Commander decks, so their nonfoil is added
      # to this commander bucket alongside #1-46
      - rawquery: "e:moc r:r number:1-46,72-79 is:paper"
        chance: 2 * 42
        count: 42
      - rawquery: "e:mul r:r -is:foilonly is:paper"
        chance: 2 * 30
        count: 30
      - use: mythic_with_showcase
        count: 33
        chance: 20
      - rawquery: "e:moc r:m number:1-46,72-79 is:paper"
        chance: 12
        count: 12
      - rawquery: "e:mul r:m -is:foilonly is:paper"
        chance: 15
        count: 15
      chance: 125
  the_list:
    set: plst
    count: 300
    code: "MOM"
  foil_etched:
    foil: true
    etched: true
    # Article: ~one third of foil-etched Multiverse Legends are rare/mythic.
    filter: "e:mul is:etched"
    count: 65
    any:
    - query: "r:u"
      count: 20
      chance: 2
    - query: "r:r or r:m"
      count: 45
      chance: 1
  mom_foil_with_showcase:
    foil: true
    # Preserve the existing rarity/variant convention. MUL insertion odds within
    # this slot are unpublished; give its cards the same base-art rarity weights.
    filter: "(e:mom is:baseset) or (e:mom number:323-337)"
    any:
    - any:
      - use: common_showcase
        rate: 1
      - use: common_has_showcase
        rate: 2
      - use: common_has_no_showcase
        rate: 3
      - use: basic
        rate: 3
      chance: 12
    - any:
      - use: uncommon_showcase
        rate: 1
      - use: uncommon_has_showcase
        rate: 2
      - use: uncommon_has_no_showcase
        rate: 3
      - rawquery: "e:mul number:1-65 r:u"
        count: 20
        rate: 3
      chance: 5
    - any:
      - use: rare_showcase
        rate: 2
      - use: rare_has_showcase
        rate: 4
      - use: rare_has_no_showcase
        rate: 6
      - use: mythic_showcase
        rate: 1
      - use: mythic_has_showcase
        rate: 2
      - use: mythic_has_no_showcase
        rate: 3
      - rawquery: "e:mul number:1-65 r:r"
        count: 30
        rate: 6
      - rawquery: "e:mul number:1-65 r:m"
        count: 15
        rate: 3
      chance: 3
