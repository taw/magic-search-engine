# data from https://magic.wizards.com/en/news/feature/collecting-march-of-the-machine
# No info on what other cards are in rare_mythic slot. Assuming it's only core set non-showcase cards
# Etched foil rate reported as 4%, or 1/25 packs
pack:
  sfc_common: 2
  sfc_uncommon: 2
  dfc_common_uncommon: 1
  uncommon_battle: 1
  wildcard: 2
  multiverse_legend: 1
  finale_1:
  - rare_mythic: 1
    chance: 3
  - rare_mythic: 1
    the_list: 1
    chance: 1
  finale_2:
  - mom_foil_with_showcase: 1
    chance: 24
  - foil_etched: 1
    chance: 1
sheets:
  sfc_common:
    query: "r:c is:sfc"
    count: 111
  dfc_common_uncommon:
    any:
    - use: dfc_common
      count: 5
      rate: 2
    - query: "r:u is:dfc -t:battle"
      count: 10
      rate: 1
  uncommon_battle:
    query: "r:u t:battle"
    count: 20
  multiverse_legend:
    # Article: ~one third of non-foil Multiverse Legends are rare/mythic.
    # base_1248_by_rarity over the 20u/30r/15m pool gave ~48%; use a 2:1
    # uncommon : rare/mythic split instead.
    filter: "e:mul -is:foilonly is:paper"
    count: 65
    any:
    - query: "r:u"
      count: 20
      chance: 2
    - query: "r:r or r:m"
      count: 45
      chance: 1
  wildcard:
    any:
    - use: common
      chance: 700
      count: 116
    - any:
      - use: uncommon
        chance: 80
        count: 80
      - rawquery: "e:mul r:u -is:foilonly is:paper"
        chance: 20
        count: 20
      chance: 175
    - any:
      - use: rare_with_showcase
        count: 78
        chance: 2 * 60
      - rawquery: "e:mom r:r number:323-337 is:paper"
        chance: 2 * 5
        count: 5
      # #72-79 (Planeswalker's Talents cycle etc.) only appear in Set and
      # Collector Boosters, not the Commander decks, so their nonfoil is added
      # to this commander bucket alongside #1-46
      - rawquery: "e:moc r:r number:1-46,72-79 is:paper"
        chance: 2 * 42
        count: 42
      - rawquery: "e:mul r:r -is:foilonly is:paper"
        chance: 2 * 30
        count: 30
      - use: mythic_with_showcase
        count: 33
        chance: 20
      - rawquery: "e:moc r:m number:1-46,72-79 is:paper"
        chance: 12
        count: 12
      - rawquery: "e:mul r:m -is:foilonly is:paper"
        chance: 15
        count: 15
      chance: 125
  the_list:
    set: plst
    count: 300
    code: "MOM"
  foil_etched:
    foil: true
    etched: true
    # Article: ~one third of foil-etched Multiverse Legends are rare/mythic.
    filter: "e:mul is:etched"
    count: 65
    any:
    - query: "r:u"
      count: 20
      chance: 2
    - query: "r:r or r:m"
      count: 45
      chance: 1
  mom_foil_with_showcase:
    # the shared base-set foil slot, but with its filter widened to also include
    # the Jumpstart cards (#323-337): per the collecting article they appear in
    # Set Boosters in traditional foil, but they are not is:baseset so the
    # default e:mom is:baseset filter misses them
    filter: "(e:mom is:baseset) or (e:mom number:323-337)"
    use: foil_with_showcase
