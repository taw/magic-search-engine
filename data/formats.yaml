m15:
  sealed:
  - 6x m15-draft
  prerelease-sealed:
    # "Hunt for the Rarest Beasts" -- box contains 6 normal boosters plus 1 seeded
    # booster of the chosen hunt (and a spindown, not modeled here)
    # https://www.youtube.com/watch?v=9-TElAVCzhw
    # the stamped foil promo sits inside the seeded booster, so it is part of the
    # pool and is not listed as a separate promo here
    choice: hunt
    variants:
      valor:
        boosters:
        - 6x m15-draft
        - 1x m15-prerelease-valor
      guile:
        boosters:
        - 6x m15-draft
        - 1x m15-prerelease-guile
      ambition:
        boosters:
        - 6x m15-draft
        - 1x m15-prerelease-ambition
      strength:
        boosters:
        - 6x m15-draft
        - 1x m15-prerelease-strength
      ferocity:
        boosters:
        - 6x m15-draft
        - 1x m15-prerelease-ferocity
  draft:
  - m15-draft
  - m15-draft
  - m15-draft
