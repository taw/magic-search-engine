# Limited formats, by set.
#
# Keys:
#   draft              - the three booster packs, in the order they are opened
#   sealed             - the sealed deck pool (unordered, so counts are used)
#   prerelease-sealed  - the sealed deck pool handed out at that set's prerelease
#
# Draft order
# -----------
# Block drafts originally added each new set to the *end* of the order, so a
# block's draft went large set first (RAV / GPT / DIS, TSP / PLC / FUT).
# Beginning with Mirrodin Besieged the order was reversed and drafts start with
# the most recent set (MBS / SOM / SOM, NPH / MBS / SOM).
# https://mtg.wiki/page/Booster_Draft#Order
#
# From Oath of the Gatewatch on, the Two-Block Paradigm drafted the second set
# of a block as BBA (two small, one large) rather than AAB.
# From Dominaria on (Three-and-One Model) every set is drafted on its own.
#
# Sealed pools
# ------------
# Until Conflux, sealed used one tournament pack plus booster packs; from
# Alara Reborn on it is six boosters. https://mtg.wiki/page/Sealed_Deck
# The `sealed` key is only filled in for the six-booster era -- the exact
# tournament-pack-era pool is not something we have a reliable source for.
#
# Prereleases
# -----------
# Tournament-pack era prereleases handed out one tournament pack of the block's
# large set plus three boosters of the new set (confirmed for Planar Chaos and
# Future Sight; assumed to hold for the rest of that era).
# https://magic.wizards.com/en/articles/archive/feature/planar-chaos-prerelease-primer-2007-01-15
#
# The prerelease card was a fixed giveaway and not part of the sealed pool until
# Return to Ravnica, which is where `unplayable-promo` gives way to
# `playable-promo`. Core sets kept the old fixed promo through Magic 2014.
# From Khans of Tarkir on the promo is a random rare/mythic of the set, and it
# ships inside the seeded prerelease booster -- where that is the case it is part
# of the booster's contents and is not listed separately here.
# https://mtg.wiki/page/Prerelease_card
#
# Play Boosters
# -------------
# Ravnica Remastered was the last set with draft boosters; from Murders at
# Karlov Manor on there is a single `<set>-play` booster, and draft and sealed
# use it in the same counts draft boosters used to (three to draft, six to seal).
# https://magic.wizards.com/en/news/making-magic/what-are-play-boosters

