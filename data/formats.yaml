  - 3x mbs-draft
  - 3x som-draft
  # "For Prereleases only, Mirrodin Besieged will come in very special packs.
  # These packs will only contain cards from a single faction. When you register
  # for an event, you will be very clearly showing your allegiance, and that will
  # affect what cards you will open, and even the Prerelease card that you receive."
  # videos confirm: 3 MBS faction packs, and 3 SOM packs
  # promo is faction-specific too, so it lives inside each variant
  prerelease-sealed:
    choice: faction
    variants:
      mirran:
