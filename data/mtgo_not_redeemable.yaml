# Sets which look like they should be redeemable on MTGO, but aren't.
#
# Redemption turns a full digital set into a physical one. It is announced per
# set on https://www.mtgo.com/news/ , and the sets where that happened are in
# data/mtgo_redemption.csv. Standard-legal sets missing from both files are
# reported by search-engine/spec/mtgo_redemption_spec.rb, so every set needs to
# be in one file or the other.
#
# The value is where we know it from. Some of these are much weaker sources
# than an announcement, but it's not a huge deal.
#
# Sets which are simply not out yet are not listed here - they're still partial
# spoilers in the card db, and the check skips them.

fdn: https://www.mtgo.com/news/foundations-on-mtgo
fin: https://www.mtgo.com/news/final-fantasy-on-mtgo
big: https://old.reddit.com/r/MTGO/comments/1c0oaty/will_the_big_score_be_redeemable/ (reddit comment by Daybreak Games employee Squiddy683)
mat: https://old.reddit.com/r/magicTCG/comments/19cawcd/march_of_the_machine_and_mom_aftermath/ (just random redditors commenting)
msh: https://magic.wizards.com/en/news/announcements/through-the-omenpaths-and-digital-universes-beyond-updates
tla: https://www.mtgo.com/news/avatar-the-last-airbender-on-mtgo
tmt: https://www.mtgo.com/news/tmnt-on-mtgo
spm: not on MTGO
w16: it's Standard-legal supplemental product, this kind of product is not typically redeemable
w17: it's Standard-legal supplemental product, this kind of product is not typically redeemable
g18: it's Standard-legal supplemental product, this kind of product is not typically redeemable
